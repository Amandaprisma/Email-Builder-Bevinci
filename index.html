/* =====================================================================
   15. Checagem, peso e rascunho automático
   ===================================================================== */
function runChecks(size, embCount, embBytes) {
  const out = [];
  const add = (level, text, detail, target) => out.push({ level, text, detail: detail || "", ...(target || {}) });
  const plural = (n, one, many) => (n === 1 ? one : many);

  if (!state.blocks.length) add("error", "O e-mail está vazio", "Arraste um bloco da lista à esquerda para começar.");
  if (!String(state.email.title || "").trim()) add("warn", "O e-mail está sem título", "O título dá nome ao arquivo exportado.", { tab: "email" });

  const pre = String(state.email.preheader || "").trim();
  if (!pre) add("info", "Sem preheader", `Será usado o texto padrão “${DEFAULT_PREHEADER}”`, { tab: "email" });
  else if (pre.length > 150) add("info", `Preheader longo (${pre.length} caracteres)`, "A caixa de entrada mostra só o começo. Deixe o essencial nas primeiras palavras.", { tab: "email" });

  const checkImage = (src, alt, name, target, required) => {
    if (!src) {
      if (required) add("error", `${name} sem imagem`, "Este bloco não entra no e-mail exportado até receber uma imagem.", target);
      return;
    }
    if (brokenImages.has(src)) add("error", `${name}: a imagem não carregou`, "Confira se a URL está correta e é pública.", target);
    else if (/^http:\/\//i.test(src)) add("warn", `${name}: endereço em http://`, "Use https:// para a imagem não ser bloqueada.", target);
    if (!String(alt || "").trim()) add("warn", `${name} sem descrição`, "Escreva o que a imagem mostra. Quem usa leitor de tela, ou está com imagens bloqueadas, lê esse texto.", target);
    else if (/\.(png|jpe?g|gif|webp|svg)$/i.test(String(alt).trim())) add("warn", `${name}: a descrição é um nome de arquivo`, "Troque por uma frase que descreva a imagem.", target);
  };

  const checkContrast = (fg, bg, name, target, large) => {
    const ratio = contrastRatio(fg, bg);
    if (ratio < (large ? 3 : 4.5)) add("info", `${name}: contraste baixo entre texto e fundo (${ratio.toFixed(1).replace(".", ",")}:1)`, `Para leitura confortável, o recomendado é pelo menos ${large ? "3" : "4,5"}:1.`, target);
  };

  state.blocks.forEach((b, i) => {
    const target = { blockId: b.id };
    const name = `${blockLabel(b)} (bloco ${i + 1})`;

    if (b.type === "image") checkImage(b.src, b.alt, name, target, true);

    if (RICH_TEXT_TYPES.includes(b.type)) {
      if (!String(b.text || "").trim()) add("warn", `${name} vazio`, "Escreva o texto ou exclua o bloco.", target);
      if (/<a href="#"/.test(b.html || "")) add("warn", `${name}: há um link sem endereço`, "Selecione o texto do link e informe o endereço.", target);
      const size = clamp(b.fontSize, 14, 1);
      checkContrast(b.color, b.backgroundColor, name, target, size >= 24 || (b.type === "heading" && size >= 19));
    }

    if (b.type === "button") {
      if (isPlaceholderUrl(b.url)) add("error", `${name} sem link de destino`, "Informe para onde o botão leva.", target);
      if (!String(b.text || "").trim()) add("warn", `${name} sem texto`, "", target);
      const size = clamp(b.fontSize, 18, 1);
      checkContrast(b.color, b.backgroundColor, name, target, size >= 19);
    }

    if (b.type === "columns") {
      (b.cols || []).forEach((c, ci) => {
        const colName = `${name}, coluna ${ci === 0 ? "esquerda" : "direita"}`;
        const empty = !c.src && !String(c.title || "").trim() && !String(c.html || "").trim() && !String(c.linkText || "").trim();
        if (empty) add("warn", `${colName} vazia`, "Coloque uma imagem ou um texto, ou troque por um bloco simples.", target);
        checkImage(c.src, c.alt, colName, target, false);
        if (String(c.linkText || "").trim() && !normalizeUrl(c.linkUrl)) add("error", `${colName}: link sem endereço`, "Informe o endereço do link no painel do bloco.", target);
      });
      checkContrast(b.color, b.backgroundColor, name, target, false);
    }

    if (b.type === "footer" && b.logo) checkImage(b.logo, b.logoAlt, `${name}, logo`, target, false);
    if (b.type === "unsubscribe" && String(b.linkText || "").trim() && !normalizeUrl(b.href)) add("error", `${name}: link sem endereço`, "", target);
  });

  if (size > GMAIL_CLIP_BYTES) {
    if (embBytes && size - embBytes <= GMAIL_CLIP_BYTES) {
      add("warn", `${embCount} ${plural(embCount, "imagem embutida deixa", "imagens embutidas deixam")} o HTML com ${fmtKb(size)}`, "Acima de 102 kB o Gmail corta a mensagem, e o Outlook para desktop pode não exibir imagens embutidas. Para enviar, hospede as imagens e cole a URL em cada bloco.");
    } else {
      add("warn", `HTML com ${fmtKb(size)}`, "Acima de 102 kB o Gmail corta a mensagem. Reduza o conteúdo ou divida em dois e-mails.");
    }
  } else if (embCount) {
    add("warn", `${embCount} ${plural(embCount, "imagem embutida", "imagens embutidas")} no arquivo`, "O Outlook para desktop pode não exibir imagens embutidas. Para enviar, hospede as imagens e cole a URL em cada bloco.");
  }

  const order = { error: 0, warn: 1, info: 2 };
  return out.sort((a, b) => order[a.level] - order[b.level]);
}

function computeDerived() {
  const html = buildExportHtml(state.blocks, state.email);
  const embedded = embeddedImages(state.blocks);
  const embBytes = embedded.reduce((sum, uri) => sum + uri.length, 0);
  const size = byteSize(html);
  derived = { size, embeddedCount: embedded.length, embeddedBytes: embBytes, checks: runChecks(size, embedded.length, embBytes) };

  const errors = derived.checks.filter(c => c.level === "error").length;
  const pending = errors + derived.checks.filter(c => c.level === "warn").length;
  const badge = $("checkBadge");
  badge.hidden = pending === 0;
  badge.textContent = pending;
  badge.className = "badge" + (errors ? " err" : "");

  const pct = Math.min(100, Math.round((size / GMAIL_CLIP_BYTES) * 100));
  const meterClass = size > GMAIL_CLIP_BYTES ? "over" : pct > 80 ? "warn" : "";
  statusBar.innerHTML = `
    <span>${state.blocks.length} ${state.blocks.length === 1 ? "bloco" : "blocos"}</span>
    <span title="Acima de 102 kB o Gmail corta a mensagem">HTML ${fmtKb(size)}<span class="meter ${meterClass}"><i style="width:${pct}%"></i></span>de 102 kB</span>
    <button type="button" data-gotab="checks">${pending ? `${icon("alert", 14)}${pending} ${pending === 1 ? "pendência" : "pendências"}` : `${icon("check", 14)}Nada pendente`}</button>
    <span class="sp">Arraste pelo <kbd>${icon("grip", 11)}</kbd> &nbsp;·&nbsp; <kbd>Alt</kbd>+<kbd>↑</kbd><kbd>↓</kbd> move &nbsp;·&nbsp; <kbd>Del</kbd> exclui</span>`;

  if (state.rightTab === "checks") renderRight();
  if (state.leftTab === "layers" && !(drag && drag.active)) renderLeft();
}

function toast(message, o = {}) {
  const box = $("toasts");
  const el = document.createElement("div");
  el.className = "toast" + (o.error ? " err" : "");
  el.setAttribute("role", o.error ? "alert" : "status");
  const span = document.createElement("span");
  span.textContent = message;
  el.appendChild(span);
  if (o.action) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = o.action;
    b.addEventListener("click", () => { el.remove(); o.onAction(); });
    el.appendChild(b);
  }
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), o.ms || (o.action ? 6000 : 3200));
}

function askText({ title, label, value = "", ok = "Salvar" }) {
  const dlg = $("askDlg");
  const input = $("askInput");
  return new Promise(resolve => {
    $("askTitle").textContent = title;
    $("askLabel").textContent = label;
    $("askOk").textContent = ok;
    input.value = value;
    let done = false;
    const finish = result => {
      if (done) return;
      done = true;
      if (dlg.open) dlg.close();
      resolve(result);
    };
    $("askForm").onsubmit = e => {
      e.preventDefault();
      const v = input.value.trim();
      if (v) finish(v);
    };
    $("askCancel").onclick = () => finish(null);
    dlg.onclose = () => finish(null);
    dlg.showModal();
    input.select();
  });
}

function syncEditable(ed) {
  const blk = ed.closest(".blk");
  if (!blk) return;
  const rich = ed.dataset.rich === "1";
  const isBlank = !ed.textContent.replace(/ /g, " ").trim() && !ed.querySelector("li");
  if (isBlank && ed.innerHTML !== "" && document.activeElement !== ed) ed.innerHTML = "";
  const value = isBlank ? "" : rich ? sanitizeEmailHtml(ed.innerHTML) : ed.textContent.replace(/\s+/g, " ").trim();
  patchBlock(blk.dataset.id, ed.dataset.edit, value, { refresh: false });

  /* mantém o campo correspondente do painel em dia, se ele estiver aberto */
  if (!rich && rightBody.dataset.scope === "block") {
    const field = rightBody.querySelector(`[data-f="${ed.dataset.edit}"]`);
    if (field && field !== document.activeElement) field.value = value;
  }
}

function insideListItem() {
  const sel = window.getSelection();
  let node = sel && sel.anchorNode;
  while (node && node !== canvas) {
    if (node.nodeType === 1 && node.tagName === "LI") return true;
    node = node.parentNode;
  }
  return false;
}

canvas.addEventListener("input", e => {
  const ed = e.target.closest("[data-edit]");
  if (ed) syncEditable(ed);
});

canvas.addEventListener("keydown", e => {
  const ed = e.target.closest("[data-edit]");
  if (!ed) return;
  if (e.key === "Escape") { e.stopPropagation(); ed.blur(); return; }
  if (e.key !== "Enter") return;
  if (ed.dataset.rich !== "1") { e.preventDefault(); ed.blur(); return; }
  /* Enter insere uma quebra de linha simples (o padrão do navegador criaria um <div>). Em listas, cria o próximo item. */
  if (!insideListItem()) {
    e.preventDefault();
    document.execCommand("insertLineBreak");
  }
});

canvas.addEventListener("paste", e => {
  const ed = e.target.closest("[data-edit]");
  if (!ed) return;
  e.preventDefault();
  const text = (e.clipboardData && e.clipboardData.getData("text/plain")) || "";
  if (ed.dataset.rich === "1") document.execCommand("insertHTML", false, nlBr(text.replace(/\r\n?/g, "\n")));
  else document.execCommand("insertText", false, text.replace(/\s+/g, " "));
});

canvas.addEventListener("focusin", e => {
  const ed = e.target.closest("[data-edit]");
  if (!ed) return;
  const blk = ed.closest(".blk");
  canvas.querySelectorAll(".blk.rich-focus").forEach(el => { if (el !== blk) el.classList.remove("rich-focus"); });

});

canvas.addEventListener("focusout", e => {
  const ed = e.target.closest("[data-edit]");
  const blk = e.target.closest(".blk");
  if (!blk) return;
  if (ed && !ed.textContent.replace(/ /g, " ").trim() && !ed.querySelector("li")) ed.innerHTML = "";

    const active = document.activeElement;
    const stillRich = active && blk.contains(active) && active.closest('[data-rich="1"]');
    if (!stillRich && linkPop.hidden) blk.classList.remove("rich-focus");

});

/* Impede que os botões da barra tirem o foco (e a seleção) do texto. */
canvas.addEventListener("mousedown", e => {

});

canvas.addEventListener("dragstart", e => e.preventDefault());

canvas.addEventListener("error", e => {
  const img = e.target;
  if (!img || img.tagName !== "IMG" || img.classList.contains("img-broken")) return;
  const src = img.getAttribute("src") || "";
  img.classList.add("img-broken");
  const note = document.createElement("div");
  note.className = "ph-broken";
  note.textContent = "A imagem não carregou. Confira se a URL está correta e é pública.";
  img.style.display = "none";
  img.insertAdjacentElement("afterend", note);

}, true);

canvas.addEventListener("click", e => {

  if (!blk) return;
  const id = blk.dataset.id;

});

function activeRichEditable() {
  const el = document.activeElement;
  return el && el.closest ? el.closest('[data-edit][data-rich="1"]') : null;
}

function runRichCommand(cmd, btn) {
  const ed = activeRichEditable();
  if (!ed) return;
  if (cmd === "createLink") { openLinkPop(btn, ed); return; }
  document.execCommand(cmd, false, null);
  if (cmd === "removeFormat") document.execCommand("unlink", false, null);
  syncEditable(ed);
}

/* ----- Link ----- */
const linkState = { ed: null, range: null };

function linkAncestor(node, root) {
  while (node && node !== root) {
    if (node.nodeType === 1 && node.tagName === "A") return node;
    node = node.parentNode;
  }
  return null;
}

function openLinkPop(btn, ed) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;
  linkState.ed = ed;
  linkState.range = sel.getRangeAt(0).cloneRange();
  const a = linkAncestor(sel.anchorNode, ed);
  const href = a ? (a.getAttribute("href") || "") : "";
  linkInput.value = href === "#" ? "" : href;
  $("linkRemove").hidden = !a;
  linkPop.classList.remove("bad");
  linkPop.hidden = false;
  const r = btn.getBoundingClientRect();
  linkPop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 312)) + "px";
  linkPop.style.top = Math.min(r.bottom + 8, window.innerHeight - 120) + "px";
  linkInput.focus();
  linkInput.select();
}

function closeLinkPop() {
  if (linkPop.hidden) return;
  linkPop.hidden = true;
  const blk = linkState.ed && linkState.ed.closest(".blk");
  if (blk && !blk.contains(document.activeElement)) blk.classList.remove("rich-focus");
  linkState.ed = null;
  linkState.range = null;
}

function applyLink(remove) {
  const ed = linkState.ed;
  const range = linkState.range;
  if (!ed || !ed.isConnected || !range) { closeLinkPop(); return; }
  const typed = linkInput.value.trim();
  const url = normalizeUrl(typed);
  if (!remove && !url) { linkPop.classList.add("bad"); linkInput.focus(); return; }

  ed.focus();
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  const a = linkAncestor(sel.anchorNode, ed);
  if (a && sel.isCollapsed) {
    const whole = document.createRange();
    whole.selectNodeContents(a);
    sel.removeAllRanges();
    sel.addRange(whole);
  }
  if (remove) document.execCommand("unlink", false, null);
  else if (sel.isCollapsed) document.execCommand("insertHTML", false, `<a href="${escAttr(url)}">${esc(typed)}</a>`);
  else document.execCommand("createLink", false, url);

  linkPop.hidden = true;
  linkState.ed = null;
  linkState.range = null;
  syncEditable(ed);
}

$("linkApply").addEventListener("click", () => applyLink(false));
$("linkRemove").addEventListener("click", () => applyLink(true));
linkInput.addEventListener("input", () => linkPop.classList.remove("bad"));
linkInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); applyLink(false); }
  if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); const ed = linkState.ed; closeLinkPop(); if (ed) ed.focus(); }
});

   ===================================================================== */
const imgPicker = $("imgPicker");
let pickTarget = null;

function pickImageFor(id, path) {
  pickTarget = { id, path };
  imgPicker.value = "";
  imgPicker.click();
}

imgPicker.addEventListener("change", () => {
  const file = imgPicker.files && imgPicker.files[0];
  if (file && pickTarget) setImageFromFile(pickTarget.id, pickTarget.path, file);
});

function noticeEmbedded(src) {
  if (embeddedNoticeShown || !src.startsWith("data:")) return;
  embeddedNoticeShown = true;
  toast(`Imagem embutida no arquivo (${fmtKb(src.length)}). Para enviar por e-mail, o mais seguro é hospedar a imagem e colar a URL no bloco.`, { ms: 7000 });
}

async function setImageFromFile(id, path, file) {
  try {
    const img = await fileToEmailImage(file);
    const block = blockById(id);
    if (!block) return;
    record();
    let next = setIn(block, path, img.src);
    if (block.type === "image" && path === "src" && !block.src) next.width = Math.min(WIDTH, img.width);
    state.blocks = state.blocks.map(b => (b.id === id ? next : b));
    const el = blockEl(id);
    if (el) updateBlockEl(el, next);
    if (dirtyId === id) dirtyId = null;
    if (state.selectedId === id) renderRight();
    changed();
    noticeEmbedded(img.src);
  } catch (error) {
    toast(error.message || "Não foi possível usar essa imagem.", { error: true });
  }
}

async function insertImageFiles(files, index) {
  const blocks = [];
  for (const file of files) {
    try {
      const img = await fileToEmailImage(file);
      blocks.push(makeBlock("image", { src: img.src, width: Math.min(WIDTH, img.width) }));
    } catch (error) {
      toast(error.message || "Não foi possível usar essa imagem.", { error: true });
    }
  }
  if (!blocks.length) return;
  insertBlocks(blocks, index);
  noticeEmbedded(blocks[0].src);
}

const hasFiles = e => !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files"));
const imageFilesOf = e => Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f => f.type.startsWith("image/"));

/* Soltar arquivo fora de uma área preparada não deve fazer o navegador abrir a imagem. */
window.addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener("drop", e => { if (hasFiles(e)) e.preventDefault(); });

let fileOverSlot = null;

stageScroll.addEventListener("dragover", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "copy";
  const slot = e.target.closest ? e.target.closest("[data-pick]") : null;
  if (fileOverSlot && fileOverSlot !== slot) fileOverSlot.classList.remove("over");
  fileOverSlot = slot;
  if (slot) { slot.classList.add("over"); hideDropLine(); return; }
  showDropLineAt(canvasInsertion(e.clientY));
});

stageScroll.addEventListener("dragleave", e => {
  if (e.relatedTarget && stageScroll.contains(e.relatedTarget)) return;
  hideDropLine();
  if (fileOverSlot) { fileOverSlot.classList.remove("over"); fileOverSlot = null; }
});

stageScroll.addEventListener("drop", e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  hideDropLine();
  const files = imageFilesOf(e);
  const slot = fileOverSlot;
  if (slot) { slot.classList.remove("over"); fileOverSlot = null; }
  if (!files.length) { toast("Solte um arquivo de imagem (JPG, PNG ou GIF).", { error: true }); return; }
  const blk = slot && slot.closest(".blk");
  if (slot && blk) { setImageFromFile(blk.dataset.id, slot.dataset.pick, files[0]); return; }
  insertImageFiles(files, canvasInsertion(e.clientY).index);
});

rightBody.addEventListener("dragover", e => {
  const zone = e.target.closest ? e.target.closest(".imgdrop") : null;
  if (!zone || !hasFiles(e)) return;
  e.preventDefault();
  zone.classList.add("over");
});
rightBody.addEventListener("dragleave", e => {
  const zone = e.target.closest ? e.target.closest(".imgdrop") : null;
  if (zone) zone.classList.remove("over");
});
rightBody.addEventListener("drop", e => {
  const zone = e.target.closest ? e.target.closest(".imgdrop") : null;
  if (!zone || !hasFiles(e)) return;
  e.preventDefault();
  const files = imageFilesOf(e);
  if (files.length && state.selectedId) setImageFromFile(state.selectedId, zone.dataset.pick, files[0]);
});

document.addEventListener("paste", e => {
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA)$/.test(t.tagName))) return;
  const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  e.preventDefault();
  insertImageFiles(files, insertionIndexAfterSelection());
});

/* =====================================================================
   19. Arrastar e soltar
   ===================================================================== */
let drag = null;
let suppressClick = false;
let scrollRaf = 0;

function canvasInsertion(y) {
  const els = Array.from(canvas.querySelectorAll(":scope > .blk"));
  const cr = canvas.getBoundingClientRect();
  let index = els.length;
  for (let i = 0; i < els.length; i++) {
    const r = els[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) { index = i; break; }
  }
  let top;
  if (!els.length) top = cr.top + 14;
  else if (index < els.length) top = els[index].getBoundingClientRect().top;
  else top = els[els.length - 1].getBoundingClientRect().bottom;
  const sr = stageScroll.getBoundingClientRect();
  top = Math.max(sr.top + 2, Math.min(top, sr.bottom - 2));
  return { index, top, left: cr.left, width: cr.width };
}

function layerInsertion(y) {
  const list = $("layerList");
  const els = list ? Array.from(list.querySelectorAll(".layer")) : [];
  if (!list || !els.length) return null;
  const lr = list.getBoundingClientRect();
  let index = els.length;
  for (let i = 0; i < els.length; i++) {
    const r = els[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) { index = i; break; }
  }
  const top = index < els.length ? els[index].getBoundingClientRect().top - 3 : els[els.length - 1].getBoundingClientRect().bottom + 2;
  return { index, top, left: lr.left, width: lr.width };
}

function showDropLineAt(pos) {
  dropLine.hidden = false;
  dropLine.style.left = pos.left + "px";
  dropLine.style.top = pos.top + "px";
  dropLine.style.width = pos.width + "px";
}

function hideDropLine() {
  dropLine.hidden = true;
}

function startDragCandidate(e, payload) {
  if (e.button !== 0 || drag) return;
  drag = { ...payload, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, active: false, zone: null, index: -1 };
  document.addEventListener("pointermove", onDragMove);
  document.addEventListener("pointerup", onDragEnd);
  document.addEventListener("pointercancel", cancelDrag);
}

function onDragMove(e) {
  if (!drag) return;
  drag.x = e.clientX;
  drag.y = e.clientY;
  if (!drag.active) {
    if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 6) return;
    drag.active = true;
    suppressClick = true;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
    closeLinkPop();
    document.body.classList.add("dragging");
    dragGhost.innerHTML = `${icon(drag.icon, 16)}<span>${esc(drag.label)}</span>`;
    dragGhost.hidden = false;
    if (drag.kind === "move") {
      const el = blockEl(drag.id);
      if (el) el.classList.add("drag-src");
      const layer = leftBody.querySelector(`.layer[data-layer="${drag.id}"]`);
      if (layer) layer.classList.add("drag-src");
    }
    scrollRaf = requestAnimationFrame(autoScroll);
  }
  e.preventDefault();
  dragGhost.style.transform = `translate(${drag.x + 14}px, ${drag.y + 14}px)`;
  updateDropTarget();
}

function updateDropTarget() {
  if (!drag || !drag.active) return;
  const under = document.elementFromPoint(drag.x, drag.y);
  let pos = null;
  let zone = null;
  if (under && under.closest("#stageScroll")) { pos = canvasInsertion(drag.y); zone = "canvas"; }
  else if (under && under.closest("#layerList")) { pos = layerInsertion(drag.y); zone = pos ? "layers" : null; }
  drag.zone = zone;
  drag.index = pos ? pos.index : -1;
  if (pos) showDropLineAt(pos);
  else hideDropLine();
}

function autoScroll() {
  if (!drag || !drag.active) return;
  [stageScroll, leftBody].forEach(box => {
    const r = box.getBoundingClientRect();
    if (drag.x < r.left || drag.x > r.right) return;
    const edge = 64;
    let delta = 0;
    if (drag.y < r.top + edge) delta = -Math.ceil((r.top + edge - drag.y) / 5);
    else if (drag.y > r.bottom - edge) delta = Math.ceil((drag.y - (r.bottom - edge)) / 5);
    if (delta) {
      const before = box.scrollTop;
      box.scrollTop += Math.max(-22, Math.min(22, delta));
      if (box.scrollTop !== before) updateDropTarget();
    }
  });
  scrollRaf = requestAnimationFrame(autoScroll);
}

function endDragCleanup() {
  document.removeEventListener("pointermove", onDragMove);
  document.removeEventListener("pointerup", onDragEnd);
  document.removeEventListener("pointercancel", cancelDrag);
  cancelAnimationFrame(scrollRaf);
  document.body.classList.remove("dragging");
  dragGhost.hidden = true;
  hideDropLine();
  document.querySelectorAll(".drag-src").forEach(el => el.classList.remove("drag-src"));
  drag = null;
  setTimeout(() => { suppressClick = false; }, 0);
}

function onDragEnd() {
  if (!drag) return;
  const d = drag;
  endDragCleanup();
  if (!d.active || !d.zone || d.index < 0) return;
  if (d.kind === "new") insertBlocks([makeBlock(d.tile.type, d.tile.overrides)], d.index);
  else if (d.kind === "saved") insertBlocks(normalizeBlocks([d.saved.block]), d.index);
  else if (d.kind === "move") moveBlockTo(d.id, d.index);
}

function cancelDrag() {
  if (drag) endDragCleanup();
}

document.addEventListener("click", e => {
  if (!suppressClick) return;
  suppressClick = false;
  e.stopPropagation();
  e.preventDefault();
}, true);

stageScroll.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  if (e.target === stageScroll && e.offsetX >= stageScroll.clientWidth) return;   // barra de rolagem
  const blk = e.target.closest(".blk");
  if (!blk) {
    if (state.selectedId) selectBlock(null);
    else flushDirty(null);
    return;
  }
  if (e.target.closest(".blk-bar")) return;
  const id = blk.dataset.id;
  selectBlock(id);
  const onGrip = !!e.target.closest("[data-grip]");
  if (onGrip || !e.target.closest("[data-edit], [data-pick]")) {
    const block = blockById(id);
    if (block) startDragCandidate(e, { kind: "move", id, label: blockLabel(block), icon: BLOCK_TYPES[block.type].icon });
  }
});

leftBody.addEventListener("pointerdown", e => {
  if (e.target.closest(".mini")) return;
  const tileEl = e.target.closest("[data-tile]");
  if (tileEl) {
    const tile = BLOCK_TILES.find(t => t.key === tileEl.dataset.tile);
    const m = tileMeta(tile);
    startDragCandidate(e, { kind: "new", tile, label: m.label, icon: m.icon });
    return;
  }
  const savedEl = e.target.closest("[data-saved]");
  if (savedEl) {
    const saved = savedBlocks.find(s => s.id === savedEl.dataset.saved);
    if (saved) startDragCandidate(e, { kind: "saved", saved, label: saved.name, icon: BLOCK_TYPES[saved.block.type].icon });
    return;
  }
  const layerEl = e.target.closest("[data-layer]");
  if (layerEl) {
    const block = blockById(layerEl.dataset.layer);
    if (block) startDragCandidate(e, { kind: "move", id: block.id, label: blockLabel(block), icon: BLOCK_TYPES[block.type].icon });
  }
});

/* =====================================================================
   20. Eventos dos painéis
   ===================================================================== */
$("leftTabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) setLeftTab(b.dataset.tab);
});

$("rightTabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (b) setRightTab(b.dataset.tab);
});

leftBody.addEventListener("click", e => {
  const delSaved = e.target.closest("[data-del-saved]");
  if (delSaved) {
    savedBlocks = savedBlocks.filter(s => s.id !== delSaved.dataset.delSaved);
    lsSet(SAVED_BLOCKS_STORAGE_KEY, savedBlocks);
    renderLeft();
    return;
  }
  const delTpl = e.target.closest("[data-del-tpl]");
  if (delTpl) { deleteTemplate(delTpl.dataset.delTpl); return; }

  const tileEl = e.target.closest("[data-tile]");
  if (tileEl) {
    const tile = BLOCK_TILES.find(t => t.key === tileEl.dataset.tile);
    insertBlocks([makeBlock(tile.type, tile.overrides)], insertionIndexAfterSelection());
    return;
  }
  const savedEl = e.target.closest("[data-saved]");
  if (savedEl) {
    const saved = savedBlocks.find(s => s.id === savedEl.dataset.saved);
    if (saved) insertBlocks(normalizeBlocks([saved.block]), insertionIndexAfterSelection());
    return;
  }
  const layerEl = e.target.closest("[data-layer]");
  if (layerEl) { selectBlock(layerEl.dataset.layer, { scroll: true }); return; }

  const tplEl = e.target.closest("[data-tpl]");
  if (tplEl) { applyTemplate(tplEl.dataset.tpl); return; }

  const doEl = e.target.closest("[data-do]");
  if (!doEl) return;
  if (doEl.dataset.do === "save-tpl") saveCurrentAsTemplate();
  if (doEl.dataset.do === "update-tpl") updateCurrentTemplate();
  if (doEl.dataset.do === "import-tpl") { $("importTemplateInput").value = ""; $("importTemplateInput").click(); }
});

leftBody.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const tplEl = e.target.closest("[data-tpl]");
  if (tplEl && e.target === tplEl) { e.preventDefault(); applyTemplate(tplEl.dataset.tpl); }
});

$("importTemplateInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => importTemplateHtml(String(reader.result || ""), file.name);
  reader.onerror = () => toast("Não foi possível ler o arquivo selecionado.", { error: true });
  reader.readAsText(file, "utf-8");
});

rightBody.addEventListener("input", e => {
  const el = e.target.closest("[data-f]");
  if (!el) return;
  const path = el.dataset.f;
  const kind = el.dataset.k || "text";
  const field = el.closest(".field");
  let value;

  if (kind === "num") {
    if (el.value === "") return;
    value = clamp(el.value, 0, Number(el.min) || 0);
    if (el.max !== "") value = Math.min(value, Number(el.max));
  } else if (kind === "color") {
    value = normColor(el.value, null);
    if (field) field.classList.toggle("bad", !value);
    if (!value) return;
  } else if (kind === "bool") {
    value = el.checked;
  } else if (kind === "src") {
    value = el.value.trim();
    if (!value) return;
  } else {
    value = el.value;
  }

  if (field) {
    field.querySelectorAll(`[data-f="${path}"]`).forEach(other => {
      if (other !== el && other.value !== String(value)) other.value = value;
    });
    const counter = field.querySelector(`[data-counter="${path}"]`);
    if (counter) counter.textContent = String(value).length;
  }
  applyField(path, value);
});

/* Ao sair do campo, mostra o valor que realmente valeu (limites de número, miniatura da imagem). */
rightBody.addEventListener("change", e => {
  const el = e.target.closest("[data-f]");
  if (!el) return;
  const kind = el.dataset.k;
  if (kind === "num") {
    const source = rightBody.dataset.scope === "email" ? state.email : blockById(state.selectedId);
    const current = source ? getIn(source, el.dataset.f) : undefined;
    if (current !== undefined && String(current) !== el.value) el.value = current;
  }
  if (kind === "src") renderRight();
});

rightBody.addEventListener("mousedown", e => {
  if (e.target.closest("[data-swatch]")) e.preventDefault();
});

rightBody.addEventListener("click", e => {
  const segBtn = e.target.closest("[data-seg] button");
  if (segBtn) {
    const seg = segBtn.parentElement;
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === segBtn));
    applyField(seg.dataset.seg, segBtn.dataset.v);
    return;
  }
  const swatch = e.target.closest("[data-swatch]");
  if (swatch) {
    const input = swatch.closest(".field").querySelector('input[type="text"]');
    input.value = swatch.dataset.swatch;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    return;
  }
  const pick = e.target.closest("[data-pick]");
  if (pick && state.selectedId) { pickImageFor(state.selectedId, pick.dataset.pick); return; }

  const clear = e.target.closest("[data-clear]");
  if (clear && state.selectedId) {
    patchBlock(state.selectedId, clear.dataset.clear, "");
    renderRight();
    return;
  }
  const goto = e.target.closest("[data-goto]");
  if (goto) { selectBlock(goto.dataset.goto, { scroll: true }); return; }

  const gotab = e.target.closest("[data-gotab]");
  if (gotab) { setRightTab(gotab.dataset.gotab); return; }

  const doEl = e.target.closest("[data-do]");
  if (doEl && doEl.dataset.do === "edit-text") focusBlockText(state.selectedId);
});

rightBody.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("imgdrop")) {
    e.preventDefault();
    if (state.selectedId) pickImageFor(state.selectedId, e.target.dataset.pick);
  }
});

statusBar.addEventListener("click", e => {
  const gotab = e.target.closest("[data-gotab]");
  if (gotab) setRightTab(gotab.dataset.gotab);
});

function focusBlockText(id) {
  const el = blockEl(id);
  const ed = el && el.querySelector("[data-edit]");
  if (!ed) return;
  el.scrollIntoView({ block: "nearest" });
  ed.focus();
  const range = document.createRange();
  range.selectNodeContents(ed);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

/* =====================================================================
   21. Barra superior, pré-visualização e exportação
   ===================================================================== */
$("undoBtn").addEventListener("click", undo);
$("redoBtn").addEventListener("click", redo);

$("viewSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  state.view = b.dataset.view;
  renderViewButtons();
  renderCanvas();
});

function setExportMenu(open) {
  exportMenu.hidden = !open;
  exportBtn.setAttribute("aria-expanded", open);
}

exportBtn.addEventListener("click", e => {
  e.stopPropagation();
  setExportMenu(exportMenu.hidden);
});

document.addEventListener("click", e => {
  if (!exportMenu.hidden && !e.target.closest(".menu-wrap")) setExportMenu(false);
  if (!linkPop.hidden && !e.target.closest("#linkPop") && !e.target.closest('[data-cmd="createLink"]')) closeLinkPop();
});

function currentExportHtml() {
  return buildExportHtml(state.blocks, state.email);
}

function fileBaseName() {
  return slugifyFileName(state.email.title || state.templateKey);
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function exportedToast(what) {
  computeDerived();
  const pending = derived.checks.filter(c => c.level !== "info").length;
  if (pending) toast(`${what}, com ${pending} ${pending === 1 ? "pendência" : "pendências"} na checagem`, { action: "Ver checagem", onAction: () => setRightTab("checks") });
  else toast(what);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    ta.remove();
    return ok;
  }
}

$("downloadHtmlBtn").addEventListener("click", () => {
  setExportMenu(false);
  downloadBlob(new Blob([currentExportHtml()], { type: "text/html" }), `${fileBaseName()}.html`);
  exportedToast("HTML baixado");
});

$("copyHtmlBtn").addEventListener("click", async () => {
  setExportMenu(false);
  if (await copyText(currentExportHtml())) exportedToast("HTML copiado");
  else toast("O navegador bloqueou a cópia. Use “Baixar HTML”.", { error: true });
});

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.async = true;
    el.onload = resolve;
    el.onerror = reject;
    document.head.appendChild(el);
  });
}

$("downloadPngBtn").addEventListener("click", async () => {
  setExportMenu(false);
  toast("Gerando o PNG…");
  try {
    if (!window.html2canvas) await loadScript("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    const sel = window.getSelection();
    if (sel) sel.removeAllRanges();
    flushDirty(null);
    canvas.classList.add("exporting");
    await new Promise(resolve => requestAnimationFrame(resolve));
    const shot = await window.html2canvas(canvas, {
      backgroundColor: normColor(state.email.containerBg, "#ffffff"),
      scale: 2, useCORS: true, allowTaint: false, logging: false
    });
    const blob = await new Promise(resolve => shot.toBlob(resolve, "image/png"));
    downloadBlob(blob, `${fileBaseName()}.png`);
    toast("PNG baixado");
  } catch (error) {
    console.error(error);
    toast("Não foi possível gerar o PNG. A exportação em imagem precisa de internet e de imagens com acesso liberado (CORS) ou embutidas.", { error: true, ms: 7000 });
  } finally {
    canvas.classList.remove("exporting");
  }
});

/* ----- Pré-visualização: o mesmo HTML que será exportado, dentro de um iframe ----- */
const pv = { mode: "desktop", dark: false };

function renderPreview() {
  const html = currentExportHtml();
  const body = $("pvBody");
  document.querySelectorAll("#pvSeg button").forEach(b => b.classList.toggle("on", b.dataset.pv === pv.mode));
  $("pvDarkWrap").hidden = pv.mode === "code";
  $("pvDark").checked = pv.dark;

  if (pv.mode === "code") {
    body.className = "pv-body";
    body.innerHTML = "<pre></pre>";
    body.firstChild.textContent = html
      .replace(/data:image\/[a-z+.-]+;base64,[A-Za-z0-9+/=]+/g, m => `${m.slice(0, m.indexOf(",") + 1)}…(${fmtKb(m.length)})`)
      .replace(new RegExp(`<!-- ${BUILDER_STATE_MARKER}:[A-Za-z0-9+/=]+ -->`), `<!-- ${BUILDER_STATE_MARKER}:… (dados para reabrir este e-mail no construtor) -->`);
    $("pvNote").textContent = "Imagens embutidas e a marca interna aparecem abreviadas aqui. “Copiar HTML” leva o código completo.";
    return;
  }

  body.className = "pv-body " + pv.mode;
  body.innerHTML = '<iframe title="Pré-visualização do e-mail" sandbox=""></iframe>';
  const darkCss = "<style>html{background:#fff;filter:invert(1) hue-rotate(180deg);}img{filter:invert(1) hue-rotate(180deg);}</style>";
  body.firstChild.srcdoc = pv.dark ? html.replace("</head>", darkCss + "</head>") : html;
  $("pvNote").textContent = pv.dark
    ? "Simulação aproximada: cada aplicativo de e-mail escurece as cores do seu jeito. Serve para notar logos e textos que somem sobre fundo escuro."
    : pv.mode === "mobile"
      ? "Largura de 375 px, com os ajustes para celular aplicados. Os links ficam desativados na pré-visualização."
      : "Este é o HTML exportado, sem as marcações do editor. Os links ficam desativados na pré-visualização.";
}

$("previewBtn").addEventListener("click", () => {
  flushDirty(null);
  pv.mode = state.view === "mobile" ? "mobile" : "desktop";
  renderPreview();
  previewDlg.showModal();
});
$("pvSeg").addEventListener("click", e => {
  const b = e.target.closest("button[data-pv]");
  if (!b) return;
  pv.mode = b.dataset.pv;
  renderPreview();
});
$("pvDark").addEventListener("change", e => { pv.dark = e.target.checked; renderPreview(); });
$("pvClose").addEventListener("click", () => previewDlg.close());
$("pvCopy").addEventListener("click", async () => {
  toast((await copyText(currentExportHtml())) ? "HTML copiado" : "O navegador bloqueou a cópia.");
});
previewDlg.addEventListener("click", e => { if (e.target === previewDlg) previewDlg.close(); });

/* =====================================================================
   22. Teclado
   ===================================================================== */
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (drag && drag.active) { cancelDrag(); return; }
    if (!exportMenu.hidden) { setExportMenu(false); return; }
  }
  if (document.querySelector("dialog[open]")) return;

  const t = e.target;
  const typing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if (typing) return;

  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (mod && !e.shiftKey && key === "z") { e.preventDefault(); undo(); return; }
  if (mod && (key === "y" || (e.shiftKey && key === "z"))) { e.preventDefault(); redo(); return; }

  /* Os atalhos de bloco só valem com o foco no palco, para não apagar nada por engano. */
  const active = document.activeElement;
  const onStage = !active || active === document.body || stageScroll.contains(active);
  if (!onStage) return;

  const id = state.selectedId;
  const idx = indexOfId(id);

  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!state.blocks.length) return;
    e.preventDefault();
    if (e.altKey && id) { moveBlockBy(id, e.key === "ArrowUp" ? -1 : 1); return; }
    const next = idx === -1 ? 0 : Math.max(0, Math.min(state.blocks.length - 1, idx + (e.key === "ArrowUp" ? -1 : 1)));
    selectBlock(state.blocks[next].id, { scroll: true });
    return;
  }
  if (!id) return;
  if (mod && key === "d") { e.preventDefault(); duplicateBlock(id); return; }
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteBlock(id); return; }
  if (e.key === "Enter") { e.preventDefault(); focusBlockText(id); return; }
  if (e.key === "Escape") selectBlock(null);
});

/* =====================================================================
   23. Início
   ===================================================================== */
(function init() {
  document.querySelectorAll("[data-icon]").forEach(el => el.insertAdjacentHTML("afterbegin", icon(el.dataset.icon, 16)));

  /* A simulação de celular no editor usa as mesmas regras do <style> exportado. */
  const mirror = document.createElement("style");
  mirror.textContent = MOBILE_RULES.map(([sel, css]) => `.canvas.mobile.mopt ${sel} { ${css} }`).join("\n");
  document.head.appendChild(mirror);

  const draft = lsGet(DRAFT_STORAGE_KEY);
  let restored = false;
  if (draft && Array.isArray(draft.blocks) && draft.blocks.length) {
    const blocks = normalizeBlocks(draft.blocks);
    if (blocks.length) {
      state.templateKey = draft.templateKey || DEFAULT_TEMPLATE_KEY;
      state.email = normalizeEmailOptions(draft.email || {}, "Email");
      state.blocks = blocks;
      restored = true;
    }
  }
  if (!restored) Object.assign(state, buildTemplateState(DEFAULT_TEMPLATE_KEY));

  renderAll();
  computeDerived();
  if (restored) {
    const when = draft.savedAt ? new Date(draft.savedAt) : null;
    $("saveState").textContent = when ? `Rascunho de ${when.toLocaleDateString("pt-BR")} restaurado` : "Rascunho restaurado";
  }
})();
