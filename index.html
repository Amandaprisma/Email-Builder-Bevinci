  <title>Email Builder Bevinci</title>
  <!-- Email Builder Bevinci: arrastar e soltar, edição direta, checagem e exportação. Arquivo único, sem dependências. -->
  <style>
:root {
  --marca: #b31a5a;
  --marca-escura: #881451;
  --marca-clara: #fbeaf2;
  --roxo: #6a245a;
  --rosa: #de4675;
  --papel: #f3f0f2;
  --tinta: #16202c;
  --tinta-2: #55606e;
  --tinta-3: #8a94a1;
  --linha: #dde2e8;
  --branco: #ffffff;
  --erro: #b3261e;
  --aviso: #9a5b00;
  --ok: #1b7f4b;
  --raio: 8px;
  --fonte: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font: 13px/1.45 var(--fonte);
  color: var(--tinta);
  background: var(--papel);
  overflow: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
.bar :focus-visible { outline-color: #fff; }

.icon { display: inline-block; vertical-align: -3px; flex-shrink: 0; }

/* ---------- Estrutura ---------- */
.app { display: flex; flex-direction: column; height: 100vh; }

.bar {
  /* o mesmo degradê do logo, do roxo ao rosa */
  background: linear-gradient(100deg, var(--roxo) 0%, #a23368 58%, #d4426f 100%);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 14px;
  flex-shrink: 0;
}

.bar-brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 15px; white-space: nowrap; min-width: 0; }
.bar-logo { height: 30px; width: auto; display: block; }
.bar-app { padding-left: 12px; border-left: 1px solid rgba(255,255,255,.35); font-weight: 600; }
.save-state { font-weight: 400; font-size: 12px; opacity: .78; margin-left: 4px; overflow: hidden; text-overflow: ellipsis; }
.save-state.bad { opacity: 1; color: #ffd9a3; }

.bar-mid { display: flex; align-items: center; gap: 6px; margin: 0 auto; }
.bar-actions { display: flex; align-items: center; gap: 6px; }

.ib {
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 7px;
  background: transparent; color: inherit;
}
.bar .ib:hover:not(:disabled) { background: rgba(255,255,255,.16); }
.ib:disabled { opacity: .35; cursor: default; }

.bbtn {
  height: 32px; padding: 0 12px;
  display: inline-flex; align-items: center; gap: 7px;
  border-radius: 7px; border: 1px solid transparent;
  font-weight: 600; font-size: 12.5px; text-decoration: none; white-space: nowrap;
}
.bbtn.ghost { background: rgba(60,12,48,.22); color: #fff; border-color: rgba(255,255,255,.42); }
.bbtn.ghost:hover { background: rgba(60,12,48,.4); }
.bbtn.solid { background: #fff; color: var(--marca-escura); }
.bbtn.solid:hover { background: var(--marca-clara); }

.seg { display: inline-flex; border-radius: 7px; padding: 2px; gap: 2px; background: #e6eaef; }
.seg button {
  border: 0; background: transparent; border-radius: 5px;
  padding: 4px 9px; min-height: 26px;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; color: var(--tinta-2);
}
.seg button.on { background: #fff; color: var(--tinta); box-shadow: 0 1px 2px rgba(22,32,44,.18); }
.seg.wide { display: flex; }
.seg.wide button { flex: 1; justify-content: center; }
.bar .seg { background: rgba(60,12,48,.32); margin-left: 10px; }
.bar .seg button { color: rgba(255,255,255,.82); }
.bar .seg button.on { background: #fff; color: var(--marca-escura); }

.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 40;
  min-width: 250px; padding: 6px;
  background: #fff; color: var(--tinta);
  border: 1px solid var(--linha); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(22,32,44,.2);
}
.menu button {
  width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left;
  border: 0; background: transparent; border-radius: 7px; padding: 8px 10px;
}
.menu button:hover { background: var(--papel); }
.menu button b { display: block; font-weight: 600; }
.menu button small { display: block; color: var(--tinta-2); font-size: 11.5px; }
.menu .icon { margin-top: 2px; color: var(--marca); }

.work { display: flex; flex: 1; min-height: 0; }

.side { background: #fff; display: flex; flex-direction: column; flex-shrink: 0; min-height: 0; }
.side.left { width: 264px; border-right: 1px solid var(--linha); }
.side.right { width: 316px; border-left: 1px solid var(--linha); }

.tabs { display: flex; border-bottom: 1px solid var(--linha); flex-shrink: 0; padding: 0 6px; }
.tabs button {
  flex: 1; border: 0; background: none; padding: 11px 4px 9px;
  font-weight: 600; font-size: 12.5px; color: var(--tinta-2);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.tabs button:hover { color: var(--tinta); }
.tabs button.on { color: var(--marca); border-bottom-color: var(--marca); }
.badge {
  min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
  background: var(--aviso); color: #fff; font-size: 10.5px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}
.badge.err { background: var(--erro); }
.badge.ok { background: var(--ok); }

.side-body { flex: 1; overflow: auto; padding: 14px; min-height: 0; }

.h {
  font-size: 12px; font-weight: 650; color: var(--tinta);
  margin: 18px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.h:first-child { margin-top: 0; }
.hint { font-size: 11.5px; color: var(--tinta-2); line-height: 1.45; margin: 6px 0 0; }
.hint.center { text-align: center; padding: 18px 8px; }

/* ---------- Blocos (lista) ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 66px; padding: 8px 4px;
  border: 1px solid var(--linha); border-radius: var(--raio); background: #fff;
  font-size: 12px; font-weight: 600; color: var(--tinta);
  cursor: grab; touch-action: none; user-select: none; text-align: center;
}
.tile .icon { color: var(--marca); }
.tile:hover { border-color: var(--marca); background: var(--marca-clara); }

.saved, .layer, .tpl {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--linha); border-radius: var(--raio); background: #fff;
  padding: 7px 8px; margin-bottom: 5px;
  user-select: none;
}
.saved, .layer { cursor: grab; touch-action: none; }
.saved:hover, .layer:hover, .tpl:hover { border-color: #b7c6d6; }
.saved .icon, .layer .icon { color: var(--tinta-3); }
.saved .txt, .layer .txt, .tpl .txt { flex: 1; min-width: 0; }
.txt b { display: block; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txt small { display: block; color: var(--tinta-2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer.on { border-color: var(--marca); background: var(--marca-clara); }
.layer.on .icon { color: var(--marca); }
.layer.drag-src, .blk.drag-src { opacity: .35; }
.mini {
  width: 24px; height: 24px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 6px; background: transparent; color: var(--tinta-3);
}
.mini:hover { background: var(--papel); color: var(--tinta); }
.mini.danger:hover { background: #fde8e6; color: var(--erro); }

.tpl { cursor: pointer; }
.tpl.on { border-color: var(--marca); box-shadow: inset 3px 0 0 var(--marca); }
.tpl .swatch { width: 28px; height: 34px; border-radius: 4px; background: var(--marca); flex-shrink: 0; position: relative; overflow: hidden; border: 1px solid rgba(0,0,0,.08); }
.tpl .swatch::after { content: ""; position: absolute; left: 0; right: 0; top: 10px; bottom: 0; background: #fff; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 32px; padding: 5px 12px;
  border: 1px solid var(--linha); border-radius: 7px; background: #fff;
  font-weight: 600; font-size: 12.5px; color: var(--tinta);
}
.btn:hover { border-color: #b7c6d6; background: #f8fafc; }
.btn.primary { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.primary:hover { background: var(--marca-escura); }
.btn.block { width: 100%; margin-bottom: 6px; }
.btn.small { min-height: 26px; padding: 2px 8px; font-size: 12px; }
.btn.danger { color: var(--erro); }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- Palco ---------- */
.stage { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage-scroll { flex: 1; overflow: auto; padding: 52px 48px 120px; min-height: 0; background: #d9d9d9; }

.canvas {
  width: 600px; max-width: 100%; margin: 0 auto;
  background: #fff; position: relative;
  box-shadow: 0 1px 2px rgba(22,32,44,.12), 0 10px 30px rgba(22,32,44,.14);
  transition: width .18s ease;
}
.canvas.mobile { width: 360px; }

.empty {
  padding: 56px 28px; text-align: center; color: var(--tinta-2); font-size: 13px;
  border: 2px dashed #c3ccd6; margin: 14px; border-radius: 10px;
}
.empty b { display: block; color: var(--tinta); font-size: 14px; margin-bottom: 4px; }

.blk { position: relative; }
.blk::after {
  content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none;
  border: 2px solid transparent;
}
.blk:hover::after { border-color: rgba(179,26,90,.35); }
.blk.selected::after { border-color: var(--marca); }

.blk-body {
  all: initial; display: block; overflow: hidden;
}
.blk-body * { box-sizing: content-box; }
.blk-body img { -webkit-user-drag: none; user-select: none; }
.blk-body a { cursor: default; }
.blk-body [data-edit] { cursor: text; outline: none; min-height: 1em; }
.blk-body [data-edit]:focus { outline: 1px dashed rgba(179,26,90,.55); outline-offset: 3px; }
.blk-body [data-edit]:empty::before { content: attr(data-ph); opacity: .42; }
.blk-body [data-rich="1"] a { color: inherit; text-decoration: underline; }
.blk-body [data-rich="1"] ul, .blk-body [data-rich="1"] ol { margin: 6px 0 6px 18px; padding: 0; }
.blk-body [data-rich="1"] li { margin: 0 0 4px 0; padding: 0; }
.blk:not(.selected) .opt-empty { display: none; }

.ph-img, .ph-empty {
  display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  font: 12px/1.4 var(--fonte); color: #55606e;
}
.ph-img {
  min-height: 110px; padding: 14px;
  background: #f3f5f8; border: 2px dashed #b9c3ce; border-radius: 8px; cursor: pointer;
  flex-direction: column;
}
.ph-img.small { min-height: 72px; }
.ph-img:hover, .ph-img.over { border-color: #b31a5a; background: #fbeaf2; color: #b31a5a; }
.ph-img u { text-underline-offset: 2px; }
.ph-empty { padding: 12px 20px; background: repeating-linear-gradient(135deg, #f6f7f9 0 8px, #eef1f5 8px 16px); }
.ph-broken { padding: 22px 16px; text-align: center; font: 12px/1.4 var(--fonte); color: #b3261e; background: #fdeeed; border: 2px dashed #e2a39e; }

.blk-grip {
  position: absolute; left: -34px; top: 0; z-index: 5;
  width: 34px; height: 34px; padding: 3px 10px 3px 2px;
  border: 0; background: transparent; cursor: grab; touch-action: none;
  opacity: 0; color: #fff;
}
.blk-grip span {
  width: 22px; height: 28px; border-radius: 6px; background: var(--tinta);
  display: flex; align-items: center; justify-content: center;
}
.blk:hover > .blk-grip, .blk.selected > .blk-grip { opacity: 1; }
.blk.selected > .blk-grip span { background: var(--marca); }

/* o deslocamento é medido a partir da borda interna do palco (52px de respiro), daí o valor negativo */
.blk-barwrap { position: sticky; top: -8px; height: 0; z-index: 6; display: none; pointer-events: none; }
.blk.selected > .blk-barwrap { display: block; }
.blk-bar {
  position: absolute; left: 0; bottom: 6px; pointer-events: auto;
  display: flex; align-items: center; gap: 2px; white-space: nowrap;
  background: var(--tinta); color: #fff; border-radius: 8px; padding: 3px;
  box-shadow: 0 4px 14px rgba(22,32,44,.3);
  font: 12px/1 var(--fonte);
}
.blk-name { padding: 0 8px 0 7px; font-weight: 600; }
.blk-bar button {
  width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent; color: #fff;
  display: inline-flex; align-items: center; justify-content: center; font-size: 13px;
}
.blk-bar button:hover { background: rgba(255,255,255,.18); }
.blk-bar button[data-act="del"]:hover { background: var(--erro); }
.blk-bar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.25); margin: 0 3px; }
.blk-bar .fmt { display: none; align-items: center; gap: 2px; }
.blk.rich-focus .blk-bar .fmt { display: inline-flex; }

.canvas.mobile .blk[data-hide]::before {
  content: "Oculto no celular"; position: absolute; right: 6px; top: 6px; z-index: 4;
  font: 600 11px/1 var(--fonte); color: #fff; background: rgba(22,32,44,.82);
  padding: 4px 7px; border-radius: 5px;
}
.canvas.mobile .blk[data-hide] .blk-body { opacity: .28; }

.canvas.exporting .blk::after, .canvas.exporting .blk::before,
.canvas.exporting .blk-grip, .canvas.exporting .blk-barwrap,
.canvas.exporting .ph-img, .canvas.exporting .ph-empty, .canvas.exporting .ph-broken, .canvas.exporting .opt-empty { display: none !important; }
.canvas.exporting { box-shadow: none; }
.canvas.exporting.mobile .blk[data-hide] { display: none; }

.status {
  flex-shrink: 0; display: flex; align-items: center; gap: 14px;
  padding: 6px 14px; background: #fff; border-top: 1px solid var(--linha);
  font-size: 12px; color: var(--tinta-2);
}
.status button { border: 0; background: none; padding: 2px 4px; border-radius: 5px; color: inherit; display: inline-flex; align-items: center; gap: 5px; }
.status button:hover { background: var(--papel); color: var(--tinta); }
.meter { width: 90px; height: 6px; border-radius: 3px; background: #e3e7ec; overflow: hidden; display: inline-block; vertical-align: middle; margin: 0 6px; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.meter.warn i { background: #d98a00; }
.meter.over i { background: var(--erro); }
.status > * { white-space: nowrap; }
.status .sp { margin-left: auto; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
kbd { font: 11px var(--fonte); border: 1px solid var(--linha); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; color: var(--tinta-2); }

/* ---------- Arrastar ---------- */
#dropLine {
  position: fixed; z-index: 90; height: 4px; margin-top: -2px; border-radius: 2px;
  background: var(--rosa); pointer-events: none;
  box-shadow: 0 0 0 2px rgba(255,255,255,.9);
}
#dropLine::before, #dropLine::after {
  content: ""; position: absolute; top: -4px; width: 12px; height: 12px; border-radius: 50%;
  background: var(--rosa); box-shadow: 0 0 0 2px rgba(255,255,255,.9);
}
#dropLine::before { left: -6px; }
#dropLine::after { right: -6px; }
#dragGhost {
  position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none;
  display: inline-flex; align-items: center; gap: 7px;
  padding: 7px 11px; border-radius: 8px; background: var(--tinta); color: #fff;
  font-weight: 600; font-size: 12px; box-shadow: 0 8px 22px rgba(22,32,44,.35);
}
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none !important; }
body.dragging .blk:hover::after { border-color: transparent; }
body.dragging .blk-grip, body.dragging .blk-barwrap { display: none !important; }

/* ---------- Painel de propriedades ---------- */
.field { margin-bottom: 11px; }
.field > label, .lbl { display: block; font-size: 11.5px; font-weight: 600; color: var(--tinta-2); margin-bottom: 4px; }
.input, .select, .textarea {
  width: 100%; border: 1px solid #cdd4dc; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; background: #fff; min-height: 30px;
}
.input:focus, .select:focus, .textarea:focus { outline: 2px solid var(--marca); outline-offset: -1px; border-color: var(--marca); }
.textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
.field.bad .input { border-color: var(--erro); outline-color: var(--erro); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.grid-4 .field > label { font-weight: 500; text-align: center; }
.grid-4 .input { text-align: center; padding: 6px 2px; }
.counter { float: right; font-weight: 500; color: var(--tinta-3); }

.color-row { display: flex; gap: 6px; align-items: center; }
.color-row input[type="color"] {
  width: 32px; height: 30px; padding: 0; border: 1px solid #cdd4dc; border-radius: 6px; background: #fff; flex-shrink: 0; cursor: pointer;
}
.color-row input[type="color"]::-webkit-color-swatch-wrapper { padding: 3px; }
.color-row input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 3px; }
.swatches { display: none; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.field:focus-within .swatches { display: flex; }
.swatches button { width: 20px; height: 20px; border-radius: 50%; border: 1px solid rgba(22,32,44,.25); padding: 0; }
.swatches button:hover { transform: scale(1.15); }

.range-row { display: flex; gap: 8px; align-items: center; }
.range-row input[type="range"] { flex: 1; accent-color: var(--marca); min-width: 0; }
.range-row .input { width: 62px; flex-shrink: 0; }

.switch { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; margin-bottom: 11px; }
.switch input { accent-color: var(--marca); width: 16px; height: 16px; margin: 1px 0 0; flex-shrink: 0; }
.switch b { display: block; font-weight: 600; font-size: 12.5px; }
.switch small { display: block; color: var(--tinta-2); font-size: 11.5px; }

.imgdrop {
  display: flex; align-items: center; gap: 10px; padding: 8px; margin-bottom: 6px;
  border: 1.5px dashed #b9c3ce; border-radius: 8px; background: #f8fafc; cursor: pointer; font-size: 12px; color: var(--tinta-2);
}
.imgdrop:hover, .imgdrop.over { border-color: var(--marca); background: var(--marca-clara); color: var(--marca); }
.imgdrop img, .imgdrop .noimg {
  width: 54px; height: 40px; border-radius: 5px; object-fit: cover; background: #e3e7ec; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; color: var(--tinta-3);
}
.imgdrop span { flex: 1; min-width: 0; }

.group { border-top: 1px solid var(--linha); margin-top: 14px; padding-top: 12px; }
.group > .h { margin-top: 0; }
.colcard { border: 1px solid var(--linha); border-radius: 8px; padding: 10px 10px 2px; margin-bottom: 10px; background: #fbfcfd; }
.colcard > .h { margin-top: 0; }

/* ---------- Checagem ---------- */
.check-sum { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--papel); margin-bottom: 12px; font-weight: 600; }
.check-sum.ok { background: #e4f4ea; color: var(--ok); }
.issue {
  display: flex; gap: 9px; align-items: flex-start; width: 100%; text-align: left;
  border: 1px solid var(--linha); border-radius: 8px; background: #fff; padding: 8px 10px; margin-bottom: 6px;
  font-size: 12.5px; line-height: 1.4;
}
button.issue:hover { border-color: #b7c6d6; background: #f8fafc; }
.issue .icon { margin-top: 1px; }
.issue.error .icon { color: var(--erro); }
.issue.warn .icon { color: var(--aviso); }
.issue.info .icon { color: var(--tinta-3); }
.issue small { display: block; color: var(--tinta-2); font-size: 11.5px; margin-top: 1px; }
.weight { margin: 4px 0 14px; font-size: 12px; color: var(--tinta-2); }
.weight .meter { width: 100%; margin: 6px 0 0; display: block; height: 8px; border-radius: 4px; }

/* ---------- Diálogos, avisos ---------- */
dialog { border: 0; border-radius: 12px; padding: 0; color: var(--tinta); box-shadow: 0 24px 70px rgba(22,32,44,.4); max-width: calc(100vw - 32px); }
dialog::backdrop { background: rgba(22,32,44,.55); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--linha); }
.dlg-head h2 { font-size: 14px; margin: 0; font-weight: 650; }
.dlg-head .sp { margin-left: auto; }
.dlg-head .switch { margin: 0; align-items: center; }
.dlg-head .ib:hover { background: var(--papel); }
#previewDlg { width: 980px; height: calc(100vh - 48px); }
#previewDlg[open] { display: flex; flex-direction: column; }
.pv-body { flex: 1; overflow: auto; background: #cfd5dc; display: flex; justify-content: center; padding: 20px; min-height: 0; }
.pv-body iframe { border: 0; background: #fff; height: 100%; width: 100%; max-width: 760px; box-shadow: 0 6px 24px rgba(22,32,44,.2); }
.pv-body.mobile iframe { max-width: 375px; border-radius: 18px; }
.pv-body pre {
  margin: 0; width: 100%; background: #16202c; color: #dbe4ee; padding: 16px; border-radius: 8px; overflow: auto;
  font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word;
}
.pv-note { padding: 7px 16px; font-size: 11.5px; color: var(--tinta-2); border-top: 1px solid var(--linha); }
#askDlg { width: 380px; }
#askDlg form { padding: 16px; }
#askDlg h2 { font-size: 14px; margin: 0 0 12px; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }

#linkPop {
  position: fixed; z-index: 80; width: 300px; padding: 10px;
  background: #fff; border: 1px solid var(--linha); border-radius: 10px; box-shadow: 0 12px 32px rgba(22,32,44,.25);
}
#linkPop .row { display: flex; gap: 6px; margin-top: 8px; justify-content: flex-end; }
#linkPop.bad .input { border-color: var(--erro); }

#toasts { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 120; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px;
  background: var(--tinta); color: #fff; border-radius: 9px; padding: 9px 12px 9px 14px;
  font-size: 12.5px; box-shadow: 0 10px 30px rgba(22,32,44,.35); max-width: 520px;
  animation: toast-in .16s ease-out;
}
.toast.err { background: var(--erro); }
.toast button { border: 0; background: rgba(255,255,255,.16); color: #fff; border-radius: 6px; padding: 4px 9px; font-weight: 600; font-size: 12px; white-space: nowrap; }
.toast button:hover { background: rgba(255,255,255,.3); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

@media (prefers-reduced-motion: reduce) {
  .canvas, .toast { transition: none; animation: none; }
}

@media (max-width: 1180px) {
  .side.left { width: 228px; }

function icon(name, size = 16) {
  return `<svg class="icon" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

/* =====================================================================
   3. Utilitários
   ===================================================================== */
function uid() {
  return "b-" + Math.random().toString(36).slice(2, 10);
}

function clone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function clamp(value, fallback = 0, min = 0) {
  const n = Number(value);
  return Number.isFinite(n) ? Math.max(min, n) : fallback;
}

function safeAlign(value, fallback = "left") {
  return ALIGN_OPTIONS.includes(value) ? value : fallback;
}

function esc(s = "") {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

const escAttr = esc;

function nlBr(s = "") {
  return esc(s).replace(/\n/g, "<br>");
}

/* Aceita o que a pessoa digitar e devolve um link válido, ou "" se não for um link. */
function normalizeUrl(url = "") {
  const value = String(url || "").trim();
  if (!value || value === "#") return "";
  if (/^(https?:\/\/|mailto:|tel:)/i.test(value)) return value;
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return "mailto:" + value;
  if (/^[a-z0-9-]+(\.[a-z0-9-]+)+([/?#].*)?$/i.test(value)) return "https://" + value;
  return "";
}

function isPlaceholderUrl(url = "") {
  const v = normalizeUrl(url);
  return !v || /^https?:\/\/(www\.)?example\.(com|org)\/?$/i.test(v);
}

const colorProbe = (() => {
  try { return document.createElement("canvas").getContext("2d"); } catch { return null; }
})();

/* Devolve sempre #rrggbb (ou o fallback). Evita que um valor digitado errado quebre o HTML. */
function normColor(value, fallback) {
  const s = String(value || "").trim();
  if (/^#[0-9a-f]{6}$/i.test(s)) return s.toLowerCase();
  if (/^#[0-9a-f]{3}$/i.test(s)) return "#" + s.slice(1).split("").map(c => c + c).join("").toLowerCase();
  if (!s || !colorProbe) return fallback;
  colorProbe.fillStyle = "#010203";
  colorProbe.fillStyle = s;
  const out = colorProbe.fillStyle;
  return (out !== "#010203" && /^#[0-9a-f]{6}$/i.test(out)) ? out : fallback;
}

function luminance(hex) {
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
    const c = v / 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
}

function contrastRatio(a, b) {
  const la = luminance(normColor(a, "#000000"));
  const lb = luminance(normColor(b, "#ffffff"));
  return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
}

function byteSize(str) {
  return new Blob([str]).size;
}

function fmtKb(bytes) {
  const kb = bytes / 1024;
  return (kb >= 100 ? Math.round(kb) : kb.toFixed(1).replace(".", ",")) + " kB";
}

function slugifyFileName(value = "email") {
  return String(value || "email")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "") || "email";
}

function getIn(obj, path) {
  return String(path).split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj);
}

/* Cópia imutável: os blocos nunca são alterados no lugar, o que deixa o desfazer leve. */
function setIn(obj, path, value) {
  const keys = String(path).split(".");
  const step = (o, i) => {
    const copy = Array.isArray(o) ? o.slice() : { ...(o || {}) };
    copy[keys[i]] = i === keys.length - 1 ? value : step(o ? o[keys[i]] : undefined, i + 1);
    return copy;
  };
  return step(obj, 0);
}

/* =====================================================================
   4. Texto rico
   ===================================================================== */
function sanitizeEmailHtml(html = "") {
  const temp = document.createElement("div");
  temp.innerHTML = String(html || "");
  const inlineTags = new Set(["B", "STRONG", "I", "EM", "U"]);
  const blockTags = new Set(["DIV", "P", "H1", "H2", "H3", "H4", "H5", "H6", "BLOCKQUOTE", "SECTION", "ARTICLE", "TR", "TABLE"]);
  const endsWithBreak = s => !s || /(<br>|<\/ul>|<\/ol>)$/.test(s);

  function walk(node) {
    let out = "";
    node.childNodes.forEach(child => {
      if (child.nodeType === Node.TEXT_NODE) { out += esc(child.nodeValue || ""); return; }
      if (child.nodeType !== Node.ELEMENT_NODE) return;

      const tag = child.tagName;
      if (tag === "BR") { out += "<br>"; return; }
      if (tag === "SCRIPT" || tag === "STYLE") return;

      const inner = walk(child);

      /* Cada parágrafo ou div vira uma linha: é isso que impede duas linhas de grudarem. */
      if (blockTags.has(tag)) {
        if (!endsWithBreak(out)) out += "<br>";
        out += inner.replace(/<br>$/, "") + "<br>";
        return;
      }
      if (tag === "A") {
        const href = normalizeUrl(child.getAttribute("href") || "") || "#";
        out += `<a href="${escAttr(href)}" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:underline;">${inner}</a>`;
        return;
      }
      if (tag === "UL" || tag === "OL") {
        const lower = tag.toLowerCase();
        out += `<${lower} style="Margin:6px 0 6px 18px; padding:0;">${inner}</${lower}>`;
        return;
      }
      if (tag === "LI") {
        out += `<li style="Margin:0 0 4px 0; padding:0;">${inner.replace(/<br>$/, "")}</li>`;
        return;
      }
      if (inlineTags.has(tag)) {
        if (inner) out += `<${tag.toLowerCase()}>${inner}</${tag.toLowerCase()}>`;
        return;
      }
      out += inner;
    });
    return out;
  }

  return walk(temp)
    .replace(/<br> <br>/g, "<br><br>")
    .replace(/(<br>\s*)+$/i, "");
}

/* Parágrafos: duas ou mais quebras seguidas viram uma linha em branco. O e-mail exportado leva um
   espaço fixo nessa linha (como nas versões anteriores, para o Outlook não a descartar);
   no editor a linha fica vazia, para o cursor não esbarrar em um espaço invisível. */
function compactParagraphBreaks(html = "", editor = false) {
  return String(html || "").replace(/(?:<br\s*\/?>\s*){2,}/gi, editor ? "<br><br>" : "<br>&nbsp;<br>");
}

function richHtml(html, text, ctx) {
  return compactParagraphBreaks(sanitizeEmailHtml(html || nlBr(text || "")), !!(ctx && ctx.editor));
}

function blockRichHtml(block, ctx) {
  return richHtml(block.html, block.text, ctx);
}

function plainFromHtml(html = "") {
  const temp = document.createElement("div");
  temp.innerHTML = sanitizeEmailHtml(html).replace(/<br>/g, "\n").replace(/<\/li>/g, "\n");
  return temp.textContent || "";
}

function lineHeight(fontSize, ratio) {
  return Math.round(clamp(fontSize, 14, 1) * ratio);
}

function makeBlock(type, overrides) {
  const t = BLOCK_TYPES[type] ? type : "text";
  return { id: uid(), type: t, ...clone(BLOCK_TYPES[t].defaults), ...(overrides ? clone(overrides) : {}) };
}

function blockLabel(block) {
  return (BLOCK_TYPES[block.type] || {}).label || block.type;
}

function blockSummary(block) {
  if (RICH_TEXT_TYPES.includes(block.type)) return (block.text || plainFromHtml(block.html || "")).replace(/\s+/g, " ").trim();
  if (block.type === "image") return block.alt || (block.src ? "Sem descrição" : "Sem imagem");
  if (block.type === "button") return block.text || "";
  if (block.type === "columns") return (block.cols || []).map(c => c.title || plainFromHtml(c.html || "") || (c.src ? "imagem" : "")).filter(Boolean).join(" · ");
  if (block.type === "footer") return (block.address || "").replace(/\s+/g, " ");
  if (block.type === "spacer") return clamp(block.height, 24) + " px";
  if (block.type === "unsubscribe") return [block.text, block.linkText].filter(Boolean).join(" ") || "Vazio";
  return "";
}

/* =====================================================================
   6. Renderização do e-mail (a mesma função alimenta o editor e a exportação)
   ===================================================================== */
function col(value, fallback) {
  return normColor(value, fallback);
}

function editAttrs(ctx, path, rich, placeholder, optional) {
  if (!ctx.editor) return "";
  return ` data-edit="${path}" data-rich="${rich ? 1 : 0}" contenteditable="true" spellcheck="true" data-ph="${escAttr(placeholder || "")}"${optional ? " data-opt" : ""}`;
}

function hideAttr(block) {
  return block.hideMobile ? ' class="eb-hide"' : "";
}

function imagePlaceholder(path, small, optional) {
  return `<div class="ph-img${small ? " small" : ""}${optional ? " opt-empty" : ""}" data-pick="${path}">${icon("image", small ? 18 : 22)}<span>Arraste uma imagem para cá<br>ou <u>escolha um arquivo</u></span></div>`;
}

function renderTextBlock(block, ctx) {
  const type = block.type;
  const size = clamp(block.fontSize, TEXT_SIZE[type], 1);
  const color = col(block.color, TEXT_COLOR[type]);
  const bg = col(block.backgroundColor, DEFAULT_BLOCK_BG);
  const pt = clamp(block.paddingTop, 0);
  const pb = clamp(block.paddingBottom, 0);
  const pl = clamp(block.paddingLeft, TEXT_SIDE_PADDING);
  const pr = clamp(block.paddingRight, TEXT_SIDE_PADDING);
  const weight = type === "heading" ? "bold" : "normal";

  return `
        <tr${hideAttr(block)}>
          <td class="eb-px" style="padding:${pt}px ${pr}px ${pb}px ${pl}px; font-family:${FONT}; color:${color}; background-color:${bg};">
            <div${editAttrs(ctx, "html", true, "Escreva aqui")} style="Margin:0; font-family:${FONT}; font-size:${size}px; line-height:${lineHeight(size, LINE_RATIO[type])}px; font-weight:${weight}; color:${color}; text-align:${safeAlign(block.align, "left")}; mso-line-height-rule:exactly;">${blockRichHtml(block, ctx)}</div>
          </td>
        </tr>`;
}

function renderImageBlock(block, ctx) {
  const pt = clamp(block.paddingTop, 0);
  const pb = clamp(block.paddingBottom, 0);
  const width = clamp(block.width, WIDTH, 1);
  const full = width >= WIDTH;
  const hp = full ? 0 : TEXT_SIDE_PADDING;
  const rendered = full ? WIDTH : Math.min(width, CONTENT_IMAGE_WIDTH);
  const align = full ? "center" : (["left", "center", "right"].includes(block.align) ? block.align : "center");
  const bg = col(block.backgroundColor, DEFAULT_BLOCK_BG);

  if (!block.src) {
    if (!ctx.editor) return "";
    return `
        <tr>
          <td style="padding:${pt}px ${hp}px ${pb}px ${hp}px; background-color:${bg};">${imagePlaceholder("src", false, false)}</td>
        </tr>`;
  }

  const margin = align === "left" ? "0 auto 0 0" : align === "right" ? "0 0 0 auto" : "0 auto";
  let img = `<img src="${escAttr(block.src)}" alt="${escAttr(block.alt || "")}" width="${rendered}" border="0" style="display:block; width:${rendered}px; max-width:100%; height:auto; border:0; outline:none; text-decoration:none; margin:${margin};">`;
  const href = normalizeUrl(block.href);
  if (href) img = `<a href="${escAttr(href)}" target="_blank" rel="noopener noreferrer" style="display:block; text-decoration:none;">${img}</a>`;

  return `
        <tr${hideAttr(block)}>
          <td align="${align}" style="padding:${pt}px ${hp}px ${pb}px ${hp}px; line-height:0; font-size:0; background-color:${bg}; text-align:${align};">
            ${img}
          </td>
        </tr>`;
}

function renderButtonBlock(block, ctx) {
  const pt = clamp(block.paddingTop, 0);
  const pb = clamp(block.paddingBottom, 0);
  const href = escAttr(normalizeUrl(block.url) || "#");
  const text = esc(block.text || (ctx.editor ? "" : "Acesse aqui"));
  const bg = col(block.backgroundColor, BRAND);
  const color = col(block.color, "#ffffff");
  const align = ["left", "center", "right"].includes(block.align) ? block.align : "center";
  const sectionBg = col(block.sectionBackgroundColor, DEFAULT_BLOCK_BG);
  const width = clamp(block.width, 210, 1);
  const height = clamp(block.height, 52, 1);
  const fontSize = clamp(block.fontSize, 18, 1);
  const radius = Math.min(clamp(block.borderRadius, 14, 0), Math.round(Math.min(width, height) / 2));
  const arcsize = Math.min(50, Math.round((radius / Math.min(width, height)) * 100));

  return `
        <tr${hideAttr(block)}>
          <td class="eb-px" align="${align}" style="padding:${pt}px 34px ${pb}px 34px; background-color:${sectionBg};">

            <!--[if mso]>
            <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
              xmlns:w="urn:schemas-microsoft-com:office:word"
              href="${href}"
              style="height:${height}px; v-text-anchor:middle; width:${width}px;"
              arcsize="${arcsize}%"
              strokecolor="${bg}"
              fillcolor="${bg}">
              <w:anchorlock/>
              <p align="center" style="Margin:0; color:${color}; font-family:${FONT}; font-size:${fontSize}px; font-weight:bold;">
                ${text}
              </p>
            </v:roundrect>
            <![endif]-->

            <!--[if !mso]><!-- -->
            <a${editAttrs(ctx, "text", false, "Texto do botão")} href="${href}" target="_blank" rel="noopener noreferrer" style="background-color:${bg}; border:1px solid ${bg}; border-radius:${radius}px; color:${color}; display:inline-block; font-family:${FONT}; font-size:${fontSize}px; font-weight:bold; line-height:${height}px; text-align:center; text-decoration:none; width:${width}px; max-width:100%; -webkit-text-size-adjust:none; mso-hide:all;">${text}</a>
            <!--<![endif]-->

          </td>
        </tr>`;
}

function columnWidths(block) {
  const pl = clamp(block.paddingLeft, TEXT_SIDE_PADDING);
  const pr = clamp(block.paddingRight, TEXT_SIDE_PADDING);
  const content = Math.max(120, WIDTH - pl - pr);
  const gap = Math.min(80, Math.round(clamp(block.gap, 20) / 2) * 2);
  const ratio = { "50-50": 0.5, "33-67": 1 / 3, "67-33": 2 / 3 }[block.layout] || 0.5;
  const inner = content - gap;
  const w1 = Math.round(inner * ratio);
  return { pl, pr, content, gap, widths: [w1, inner - w1] };
}

function renderColumnsBlock(block, ctx) {
  const pt = clamp(block.paddingTop, 0);
  const pb = clamp(block.paddingBottom, 0);
  const { pl, pr, content, gap, widths } = columnWidths(block);
  const bg = col(block.backgroundColor, DEFAULT_BLOCK_BG);
  const valign = block.valign === "middle" ? "middle" : "top";
  const align = ["left", "center", "right"].includes(block.align) ? block.align : "left";
  const titleSize = clamp(block.titleSize, 16, 1);
  const fontSize = clamp(block.fontSize, 14, 1);
  const titleColor = col(block.titleColor, BRAND);
  const color = col(block.color, "#000000");
  const linkColor = col(block.linkColor, BRAND);
  const cols = [0, 1].map(i => (block.cols && block.cols[i]) || {});
  const cellTable = 'role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;"';

  const columnHtml = (c, i) => {
    const w = widths[i];
    const hasTitle = !!String(c.title || "").trim();
    const hasText = !!String(c.html || "").trim();
    const linkHref = normalizeUrl(c.linkUrl);
    const hasLink = !!String(c.linkText || "").trim();
    const rows = [];

    if (c.src) {
      const gapBelow = (hasTitle || hasText || hasLink || ctx.editor) ? 10 : 0;
      rows.push(`<tr><td style="padding:0 0 ${gapBelow}px 0; line-height:0; font-size:0;"><img class="eb-colimg" src="${escAttr(c.src)}" alt="${escAttr(c.alt || "")}" width="${w}" border="0" style="display:block; width:100%; max-width:${w}px; height:auto; border:0; outline:none; text-decoration:none;"></td></tr>`);
    } else if (ctx.editor) {
      const optional = hasTitle || hasText || hasLink;
      rows.push(`<tr${optional ? ' class="opt-empty"' : ""}><td style="padding:0 0 10px 0;">${imagePlaceholder(`cols.${i}.src`, true, false)}</td></tr>`);
    }

    if (hasTitle || ctx.editor) {
      rows.push(`<tr${hasTitle ? "" : ' class="opt-empty"'}><td style="padding:0 0 6px 0;"><div${editAttrs(ctx, `cols.${i}.title`, false, "Título", true)} style="Margin:0; font-family:${FONT}; font-size:${titleSize}px; line-height:${lineHeight(titleSize, LINE_RATIO.heading)}px; font-weight:bold; color:${titleColor}; text-align:${align}; mso-line-height-rule:exactly;">${esc(c.title || "")}</div></td></tr>`);
    }

    if (hasText || ctx.editor) {
      rows.push(`<tr${hasText ? "" : ' class="opt-empty"'}><td style="padding:0 0 ${hasLink ? 8 : 0}px 0;"><div${editAttrs(ctx, `cols.${i}.html`, true, "Texto", true)} style="Margin:0; font-family:${FONT}; font-size:${fontSize}px; line-height:${lineHeight(fontSize, LINE_RATIO.text)}px; font-weight:normal; color:${color}; text-align:${align}; mso-line-height-rule:exactly;">${richHtml(c.html, "", ctx)}</div></td></tr>`);
    }

    if (hasLink) {
      rows.push(`<tr><td style="padding:0; font-family:${FONT}; font-size:${fontSize}px; line-height:${lineHeight(fontSize, LINE_RATIO.text)}px; text-align:${align}; mso-line-height-rule:exactly;"><a href="${escAttr(linkHref || "#")}" target="_blank" rel="noopener noreferrer" style="color:${linkColor}; font-weight:bold; text-decoration:underline;">${esc(c.linkText)}</a></td></tr>`);
    }

    const padL = i === 1 ? gap / 2 : 0;
    const padR = i === 0 ? gap / 2 : 0;
    return `<div class="eb-col" style="display:inline-block; width:100%; max-width:${w + gap / 2}px; vertical-align:${valign};">
              <table ${cellTable}>
                <tr>
                  <td class="eb-colpad${i === 0 ? " eb-colgap" : ""}" valign="${valign}" style="padding:0 ${padR}px 0 ${padL}px;">
                    <table ${cellTable}>
                      ${rows.join("\n                      ")}
                    </table>
                  </td>
                </tr>
              </table>
            </div>`;
  };

  const outer = [widths[0] + gap / 2, widths[1] + gap / 2];
  return `
        <tr${hideAttr(block)}>
          <td class="eb-px" align="left" style="padding:${pt}px ${pr}px ${pb}px ${pl}px; background-color:${bg}; font-size:0; line-height:0; text-align:left;">
            <!--[if mso]>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="${content}" style="width:${content}px; border-collapse:collapse;"><tr><td width="${outer[0]}" valign="${valign}" style="width:${outer[0]}px;">
            <![endif]-->
            ${columnHtml(cols[0], 0)}<!--[if mso]>
            </td><td width="${outer[1]}" valign="${valign}" style="width:${outer[1]}px;">
            <![endif]-->${columnHtml(cols[1], 1)}
            <!--[if mso]>
            </td></tr></table>
            <![endif]-->
          </td>
        </tr>`;
}

function renderBlock(block, ctx = {}) {
  const pt = clamp(block.paddingTop, 0);
  const pb = clamp(block.paddingBottom, 0);

  if (RICH_TEXT_TYPES.includes(block.type)) return renderTextBlock(block, ctx);
  if (block.type === "image") return renderImageBlock(block, ctx);
  if (block.type === "button") return renderButtonBlock(block, ctx);
  if (block.type === "columns") return renderColumnsBlock(block, ctx);

  if (block.type === "divider") {
    const thickness = Math.min(20, clamp(block.thickness, 1, 1));
    return `
        <tr${hideAttr(block)}>
          <td class="eb-px" style="padding:${pt}px 34px ${pb}px 34px; background-color:${col(block.backgroundColor, DEFAULT_BLOCK_BG)};">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
              <tr>
                <td style="height:${thickness}px; font-size:0; line-height:0; background-color:${col(block.color, "#e5e7eb")};">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>`;
  }

  if (block.type === "spacer") {
    const height = Math.min(200, clamp(block.height, 24, 1));
    return `
        <tr${hideAttr(block)}>
          <td height="${height}" style="height:${height}px; font-size:1px; line-height:${height}px; background-color:${col(block.backgroundColor, DEFAULT_BLOCK_BG)}; mso-line-height-rule:exactly;">&nbsp;</td>
        </tr>`;
  }

  if (block.type === "footer") {
    const logoWidth = clamp(block.logoWidth, 140, 1);
    const logoHtml = block.logo
      ? `<img src="${escAttr(block.logo)}" alt="${escAttr(block.logoAlt || "Logo")}" width="${logoWidth}" border="0" style="display:block; width:${logoWidth}px; height:auto; border:0; outline:none; text-decoration:none;">`
      : "";
    const footerText = [block.company || "", block.address || ""].filter(Boolean).join("\n");
    const color = col(block.color, "#ffffff");

    return `
        <tr${hideAttr(block)}>
          <td class="eb-px" style="padding:${pt}px 30px ${pb}px 30px; background-color:${col(block.backgroundColor, BRAND_DEEP)};">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse; mso-table-lspace:0pt; mso-table-rspace:0pt;">
              <tr>
                <td valign="top" style="font-family:${FONT}; font-size:10px; line-height:12px; color:${color}; mso-line-height-rule:exactly;">
                  ${nlBr(footerText)}
                </td>
                <td align="right" valign="middle" style="padding-left:10px;">
                  ${logoHtml}
                </td>
              </tr>
            </table>
          </td>
        </tr>`;
  }

  if (block.type === "unsubscribe") {
    const textValue = String(block.text || "").trim();
    const linkTextValue = String(block.linkText || "").trim();
    const hrefValue = String(block.href || "").trim();
    if (!textValue && !linkTextValue && !hrefValue) return "";

    const linkHtml = linkTextValue
      ? `<a href="${escAttr(normalizeUrl(hrefValue) || "#")}" style="color:${col(block.linkColor, BRAND)}; text-decoration:underline;">${esc(linkTextValue)}</a>`
      : "";
    const punctuation = textValue && linkHtml ? "." : "";

    return `
        <tr${hideAttr(block)}>
          <td align="center" style="padding:${pt}px 20px ${pb}px 20px; font-family:${FONT}; background-color:${col(block.backgroundColor, "#ffffff")};">
            <p style="Margin:0; font-size:11px; line-height:15px; color:${col(block.color, "#555555")}; mso-line-height-rule:exactly;">
              ${esc(textValue)} ${linkHtml}${punctuation}
            </p>
          </td>
        </tr>`;
  }

  return "";
}

function mobileStyleTag(blocks, options) {
  const rules = [];
  if (options.mobileOpt !== false) MOBILE_RULES.forEach(r => rules.push(r));
  if (blocks.some(b => b.hideMobile)) rules.push(MOBILE_HIDE_RULE);
  if (!rules.length) return "";
  return `
  <style type="text/css">
    @media only screen and (max-width:600px) {
${rules.map(([sel, css]) => `      ${sel} { ${css} }`).join("\n")}
    }
  </style>`;
}

function renderEmail(blocks, options) {
  const emailBg = col(options.emailBg, DEFAULT_EMAIL_BG);
  const containerBg = col(options.containerBg, DEFAULT_CONTAINER_BG);
  const preheader = esc(options.preheader || DEFAULT_PREHEADER);
  const title = esc(options.title || "Email");
  const contentRows = blocks.map(b => renderBlock(b, { editor: false })).join("\n");
  /* Preenchimento invisível: impede que o início do corpo apareça depois do preheader na caixa de entrada. */
  const preheaderPad = "&#847;&zwnj;&nbsp;".repeat(60);

  return `<!DOCTYPE html>

<body style="margin:0; padding:0; width:100% !important; min-width:100%; background-color:${emailBg}; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">

  <!-- Preheader -->
  <div style="display:none; font-size:1px; color:${emailBg}; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all;">
    ${preheader}${preheaderPad}
  </div>

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse; background-color:${emailBg}; margin:0; padding:0; mso-table-lspace:0pt; mso-table-rspace:0pt;">
    <tr>
      <td align="center" style="padding:14px 10px;">

        <!--[if mso]>
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px; border-collapse:collapse; background-color:${containerBg}; mso-table-lspace:0pt; mso-table-rspace:0pt;">
          <tr>
            <td>
        <![endif]-->

        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; max-width:600px; border-collapse:collapse; background-color:${containerBg}; margin:0 auto; mso-table-lspace:0pt; mso-table-rspace:0pt;">
          ${contentRows}
        </table>

        <!--[if mso]>
            </td>
          </tr>
        </table>

/* =====================================================================
   7. Normalização, exportação e importação
   ===================================================================== */
function normalizeEmailOptions(email = {}, fallbackTitle = "Template importado") {
  return {
    title: email.title || fallbackTitle || "Template importado",
    preheader: email.preheader || "",
    emailBg: normColor(email.emailBg, DEFAULT_EMAIL_BG),
    containerBg: normColor(email.containerBg, DEFAULT_CONTAINER_BG),
    mobileOpt: email.mobileOpt !== false
  };
}

const COLOR_FIELDS = ["color", "backgroundColor", "sectionBackgroundColor", "linkColor", "titleColor"];

/* Aceita blocos de qualquer versão do construtor e devolve blocos completos, com id novo. */
function normalizeBlocks(blocks = []) {
  return (Array.isArray(blocks) ? blocks : [])
    .filter(block => block && block.type && BLOCK_TYPES[block.type])
    .map(block => {
      const defaults = BLOCK_TYPES[block.type].defaults;
      const clean = { ...clone(defaults), ...clone(block), id: uid(), type: block.type };

      COLOR_FIELDS.forEach(f => { if (f in clean) clean[f] = normColor(clean[f], defaults[f] || "#ffffff"); });

      if (RICH_TEXT_TYPES.includes(clean.type)) {
        clean.html = sanitizeEmailHtml(clean.html || nlBr(clean.text || ""));
        clean.text = plainFromHtml(clean.html);
        clean.paddingLeft = clamp(clean.paddingLeft, TEXT_SIDE_PADDING);
        clean.paddingRight = clamp(clean.paddingRight, TEXT_SIDE_PADDING);
      }
      if (clean.type === "button") {
        /* Versões antigas guardavam o raio só para o Outlook; agora um único valor vale para todos. */
        if (block.borderRadius === undefined) clean.borderRadius = 14;
        delete clean.borderRadiusPct;
        if (/^https?:\/\/(www\.)?example\.com\/?$/i.test(clean.url || "")) clean.url = "";
      }
      if (clean.type === "columns") {
        clean.cols = [0, 1].map(i => {
          const c = (block.cols && block.cols[i]) || {};
          return {
            src: String(c.src || ""), alt: String(c.alt || ""), title: String(c.title || ""),
            html: sanitizeEmailHtml(c.html || ""), linkText: String(c.linkText || ""), linkUrl: String(c.linkUrl || "")
          };
        });
      }
      return clean;
    });
}

function stripIds(blocks) {
  return blocks.map(({ id, ...rest }) => rest);
}

function encodeBuilderState(payload) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}

function decodeBuilderState(encoded) {
  return JSON.parse(decodeURIComponent(escape(atob(encoded))));
}

/* Imagens embutidas, na ordem em que aparecem no e-mail. */
function embeddedImages(blocks) {
  const list = [];
  const add = src => { if (typeof src === "string" && src.startsWith("data:") && !list.includes(src)) list.push(src); };
  blocks.forEach(b => {
    if (b.type === "image") add(b.src);
    if (b.type === "footer") add(b.logo);
    if (b.type === "columns") (b.cols || []).forEach(c => add(c.src));
  });
  return list;
}

function mapImageFields(blocks, fn) {
  return blocks.map(b => {
    if (b.type === "image") return { ...b, src: fn(b.src) };
    if (b.type === "footer") return { ...b, logo: fn(b.logo) };
    if (b.type === "columns") return { ...b, cols: (b.cols || []).map(c => ({ ...c, src: fn(c.src) })) };
    return b;
  });
}

/* A marca interna guarda o projeto para reabrir o HTML no construtor.
   As imagens embutidas não são repetidas nela: ficam só no <img> e são religadas na importação. */
function buildExportHtml(blocks, email) {
  const html = renderEmail(blocks, email);
  const images = embeddedImages(blocks);
  const payload = {
    app: "email-builder-bevinci",
    version: 3,
    exportedAt: new Date().toISOString(),
    email: normalizeEmailOptions(email, email.title || "Email"),
    blocks: stripIds(mapImageFields(blocks, src => {
      const i = images.indexOf(src);
      return i === -1 ? src : IMG_REF_PREFIX + i;
    }))
  };
  const marker = `<!-- ${BUILDER_STATE_MARKER}:${encodeBuilderState(payload)} -->`;
  return html.replace("\n</body>", `\n\n  ${marker}\n</body>`);
}

function extractBuilderStateFromHtml(html = "") {
  const re = new RegExp(`<!--\\s*${BUILDER_STATE_MARKER}:([A-Za-z0-9+/=]+)\\s*-->`);
  const match = String(html || "").match(re);
  if (!match) return null;
  const payload = decodeBuilderState(match[1]);
  if (!payload || !Array.isArray(payload.blocks)) return null;

  let blocks = payload.blocks;
  const refRe = /^eb-img:(\d+)$/;
  if (/"eb-img:\d+"/.test(JSON.stringify(blocks))) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    const images = [];
    doc.querySelectorAll("img").forEach(img => {
      const src = img.getAttribute("src") || "";
      if (src.startsWith("data:") && !images.includes(src)) images.push(src);
    });
    blocks = mapImageFields(blocks, src => {
      const ref = typeof src === "string" ? src.match(refRe) : null;
      return ref ? (images[Number(ref[1])] || "") : src;
    });
  }

  return {
    email: normalizeEmailOptions(payload.email, (payload.email && payload.email.title) || "Template importado"),
    blocks: normalizeBlocks(blocks)
  };
}

/* ----- Leitura de HTMLs antigos, sem marca interna ----- */
function styleValue(el, prop, fallback = "") {
  return (el && el.style && el.style.getPropertyValue(prop)) || fallback;
}

function px(value, fallback = 0) {
  const match = String(value || "").match(/-?\d+(?:\.\d+)?/);
  return match ? Math.round(Number(match[0])) : fallback;
}

function parsePaddingFromElement(el, fallback = {}) {
  const raw = styleValue(el, "padding", "").trim();
  let top = px(styleValue(el, "padding-top"), fallback.paddingTop ?? 0);
  let right = px(styleValue(el, "padding-right"), fallback.paddingRight ?? TEXT_SIDE_PADDING);
  let bottom = px(styleValue(el, "padding-bottom"), fallback.paddingBottom ?? 0);
  let left = px(styleValue(el, "padding-left"), fallback.paddingLeft ?? TEXT_SIDE_PADDING);

  if (raw) {
    const parts = raw.split(/\s+/).map(item => px(item, 0));
    if (parts.length === 1) top = right = bottom = left = parts[0];
    if (parts.length === 2) { top = bottom = parts[0]; right = left = parts[1]; }
    if (parts.length === 3) { top = parts[0]; right = left = parts[1]; bottom = parts[2]; }
    if (parts.length >= 4) { top = parts[0]; right = parts[1]; bottom = parts[2]; left = parts[3]; }
  }

  return { paddingTop: top, paddingRight: right, paddingBottom: bottom, paddingLeft: left };
}

function directRowsOf(table) {
  const tbody = Array.from(table.children).find(child => child.tagName === "TBODY") || table;
  return Array.from(tbody.children).filter(child => child.tagName === "TR");
}

function findEmailContainerTable(doc) {
  const tables = Array.from(doc.querySelectorAll("table"));
  return tables.find(table => /max-width:\s*600px/.test(String(table.getAttribute("style") || ""))) || tables[tables.length - 1] || null;
}

function parseLegacyRowToBlock(row) {
  const td = row.children && row.children[0];
  if (!td) return null;
  const tdStyle = td.getAttribute("style") || "";
  const padding = parsePaddingFromElement(td);
  const backgroundColor = normColor(styleValue(td, "background-color"), DEFAULT_BLOCK_BG);

  const firstImg = td.querySelector("img");
  const looksLikeImageRow = firstImg && (/line-height:\s*0/i.test(tdStyle) || (td.querySelectorAll("img").length === 1 && !td.querySelector("div, p")));
  if (looksLikeImageRow) {
    return {
      ...makeBlock("image"),
      src: firstImg.getAttribute("src") || "",
      alt: firstImg.getAttribute("alt") || "",
      width: px(firstImg.getAttribute("width") || firstImg.style.width, WIDTH),
      paddingTop: padding.paddingTop,
      paddingBottom: padding.paddingBottom,
      backgroundColor
    };
  }

  const buttonLink = Array.from(td.querySelectorAll("a[href]")).find(a => /inline-block/i.test(a.getAttribute("style") || "") || styleValue(a, "background-color"));
  if (buttonLink) {
    return {
      ...makeBlock("button"),
      text: (buttonLink.textContent || "Acesse aqui").trim(),
      url: buttonLink.getAttribute("href") || "",
      align: safeAlign(td.getAttribute("align") || styleValue(td, "text-align"), "center"),
      backgroundColor: normColor(styleValue(buttonLink, "background-color"), BRAND),
      color: normColor(styleValue(buttonLink, "color"), "#ffffff"),
      width: px(styleValue(buttonLink, "width"), 210),
      height: px(styleValue(buttonLink, "line-height"), 52),
      borderRadius: px(styleValue(buttonLink, "border-radius"), 14),
      paddingTop: padding.paddingTop,
      paddingBottom: padding.paddingBottom,
      sectionBackgroundColor: backgroundColor
    };
  }

  const p = td.querySelector("p");
  const unsubLink = p && p.querySelector("a[href]");
  if (p && unsubLink && px(styleValue(p, "font-size"), 11) <= 12) {
    const fullText = (p.textContent || "").trim();
    const linkText = (unsubLink.textContent || "").trim();
    return {
      ...makeBlock("unsubscribe"),
      text: fullText.replace(linkText, "").replace(/[.\s]+$/g, "").trim(),
      linkText,
      href: unsubLink.getAttribute("href") || "",
      backgroundColor,
      color: normColor(styleValue(p, "color"), "#555555"),
      linkColor: normColor(styleValue(unsubLink, "color"), BRAND),
      paddingTop: padding.paddingTop,
      paddingBottom: padding.paddingBottom
    };
  }

  const lineCell = td.querySelector("td[style*='height:1px'], td[style*='height: 1px']");
  if (lineCell) {
    return {
      ...makeBlock("divider"),
      color: normColor(styleValue(lineCell, "background-color"), "#e5e7eb"),
      backgroundColor,
      paddingTop: padding.paddingTop,
      paddingBottom: padding.paddingBottom
    };
  }

  const div = td.querySelector("div");
  if (div) {
    const fontSize = px(styleValue(div, "font-size"), 14);
    const fontWeight = styleValue(div, "font-weight", "normal");
    const plain = (div.textContent || "").trim();
    let type = "text";
    if (fontSize <= 11) type = "note";
    if (/bold|[6-9]00/.test(fontWeight) || fontSize >= 16) type = "heading";
    if (/^(Boa leitura|Atenciosamente|Um abraço|Abraços?)/i.test(plain)) type = "signature";

    return {
      ...makeBlock(type),
      text: plain,
      html: sanitizeEmailHtml(div.innerHTML || plain),
      align: safeAlign(styleValue(div, "text-align", "left"), "left"),
      fontSize,
      color: normColor(styleValue(div, "color"), TEXT_COLOR[type]),
      backgroundColor,
      paddingTop: padding.paddingTop,
      paddingBottom: padding.paddingBottom,
      paddingLeft: padding.paddingLeft,
      paddingRight: padding.paddingRight
    };
  }

  return null;
}

function parseLegacyHtmlTemplate(html = "", fallbackName = "Template importado") {
  const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
  const titleEl = doc.querySelector("title");
  const title = ((titleEl && titleEl.textContent) || fallbackName || "Template importado").trim();
  const preheaderEl = Array.from(doc.body.querySelectorAll("div")).find(el => /display:\s*none/i.test(el.getAttribute("style") || ""));
  const emailBg = normColor(doc.body && doc.body.style.getPropertyValue("background-color"), DEFAULT_EMAIL_BG);
  const table = findEmailContainerTable(doc);
  if (!table) throw new Error("Não encontrei a tabela principal de 600px do e-mail neste arquivo.");

  const containerBg = normColor(styleValue(table, "background-color"), DEFAULT_CONTAINER_BG);
  const blocks = directRowsOf(table).map(parseLegacyRowToBlock).filter(Boolean);
  if (!blocks.length) throw new Error("Não consegui converter os blocos deste HTML. Ele foi exportado pelo construtor?");

  return {
    email: normalizeEmailOptions({
      title,
      preheader: ((preheaderEl && preheaderEl.textContent) || "").replace(/[͏‌ \s]+$/g, "").trim(),
      emailBg,
      containerBg
    }, title),
    blocks: normalizeBlocks(blocks)
  };
}

function parseImportedTemplateHtml(html = "", fallbackName = "Template importado") {
  let exact = null;
  try { exact = extractBuilderStateFromHtml(html); } catch { exact = null; }
  if (exact && exact.blocks.length) return { ...exact, importMode: "exact" };
  return { ...parseLegacyHtmlTemplate(html, fallbackName), importMode: "legacy" };
}

/* =====================================================================
   8. Imagens locais
   ===================================================================== */
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("Não foi possível ler o arquivo."));
    reader.readAsDataURL(file);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("O arquivo não é uma imagem que o navegador consiga abrir."));
    img.src = src;
  });
}

/* Lê uma imagem local e reduz o peso: no máximo 1200px de largura (2x de um e-mail de 600px). */
async function fileToEmailImage(file) {
  if (!file || !file.type || !file.type.startsWith("image/")) throw new Error("Escolha um arquivo de imagem (JPG, PNG ou GIF).");
  const raw = await readFileAsDataUrl(file);
  const img = await loadImage(raw);
  const natural = { width: img.naturalWidth || WIDTH, height: img.naturalHeight || 0 };

  if (file.type === "image/gif") return { src: raw, width: natural.width, name: file.name };

  const mustConvert = !/^image\/(jpeg|png)$/.test(file.type);
  const scale = Math.min(1, MAX_LOCAL_IMAGE_WIDTH / natural.width);
  if (!mustConvert && scale === 1 && raw.length < 300 * 1024) return { src: raw, width: natural.width, name: file.name };

  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(natural.width * scale));
  canvas.height = Math.max(1, Math.round(natural.height * scale));
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

  let hasAlpha = false;
  if (file.type !== "image/jpeg") {
    try {
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      for (let i = 3; i < data.length; i += 4 * 7) { if (data[i] < 250) { hasAlpha = true; break; } }
    } catch { hasAlpha = true; }
  }

  let out = hasAlpha ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.86);
  if (!mustConvert && scale === 1 && out.length >= raw.length) out = raw;
  return { src: out, width: canvas.width, name: file.name };
}

  templateKey: DEFAULT_TEMPLATE_KEY,

  blocks: [],
  selectedId: null,
  view: "desktop",
  leftTab: "blocks",
  rightTab: "block"
};

const hist = { past: [], future: [], key: null, time: 0 };
let dirtyId = null;                 // bloco com texto editado direto no e-mail, ainda não redesenhado
let derived = { size: 0, embeddedCount: 0, embeddedBytes: 0, checks: [] };
const brokenImages = new Set();
let embeddedNoticeShown = false;

const blockById = id => state.blocks.find(b => b.id === id) || null;
const indexOfId = id => state.blocks.findIndex(b => b.id === id);
const blockEl = id => (id ? canvas.querySelector(`:scope > .blk[data-id="${id}"]`) : null);

function snapshot() {
  return { templateKey: state.templateKey, email: state.email, blocks: state.blocks, selectedId: state.selectedId };
}

/* Mudanças seguidas no mesmo campo viram um único passo de desfazer. */
function record(key) {
  const now = Date.now();
  if (key && key === hist.key && now - hist.time < 1500) { hist.time = now; return; }
  hist.past.push(snapshot());
  if (hist.past.length > 100) hist.past.shift();
  hist.future = [];
  hist.key = key || null;
  hist.time = now;
}

function restore(snap) {
  state.templateKey = snap.templateKey;
  state.email = snap.email;
  state.blocks = snap.blocks;
  state.selectedId = state.blocks.some(b => b.id === snap.selectedId) ? snap.selectedId : null;
  hist.key = null;
  dirtyId = null;
  renderAll();
  changed();
}

function undo() {
  if (!hist.past.length) return;
  hist.future.push(snapshot());
  restore(hist.past.pop());
}

function redo() {
  if (!hist.future.length) return;
  hist.past.push(snapshot());
  restore(hist.future.pop());
}

/* =====================================================================
   11. Operações com blocos
   ===================================================================== */
function patchBlock(id, path, value, opts = {}) {
  const block = blockById(id);
  if (!block || getIn(block, path) === value) return;
  record(`${id}:${path}`);
  const next = setIn(block, path, value);
  if (path === "html") next.text = plainFromHtml(value);
  state.blocks = state.blocks.map(b => (b.id === id ? next : b));

  const el = blockEl(id);
  if (opts.refresh === false) {
    if (el) el._block = next;
    dirtyId = id;
  } else if (el) {
    updateBlockEl(el, next);
    if (dirtyId === id) dirtyId = null;
  }
  changed();
}

function patchEmail(path, value) {
  if (state.email[path] === value) return;
  record(`email:${path}`);
  state.email = { ...state.email, [path]: value };
  applyEmailLook();
  changed();
}

function insertBlocks(blocks, index) {
  if (!blocks.length) return;
  record();
  const list = state.blocks.slice();
  const at = Math.max(0, Math.min(index == null ? list.length : index, list.length));
  list.splice(at, 0, ...blocks);
  state.blocks = list;
  renderCanvas();
  selectBlock(blocks[blocks.length - 1].id, { scroll: true });
  changed();
}

function insertionIndexAfterSelection() {
  const i = indexOfId(state.selectedId);
  return i === -1 ? state.blocks.length : i + 1;
}

function deleteBlock(id) {
  const idx = indexOfId(id);
  if (idx === -1) return;
  record();
  const removed = state.blocks[idx];
  state.blocks = state.blocks.filter(b => b.id !== id);
  if (dirtyId === id) dirtyId = null;
  const neighbor = state.blocks[Math.min(idx, state.blocks.length - 1)];
  state.selectedId = neighbor ? neighbor.id : null;
  renderCanvas();
  renderRight();
  changed();
  toast(`${blockLabel(removed)} excluído`, { action: "Desfazer", onAction: undo });
}

function duplicateBlock(id) {
  const idx = indexOfId(id);
  if (idx === -1) return;
  const copy = { ...clone(state.blocks[idx]), id: uid() };
  insertBlocks([copy], idx + 1);
}

/* index = posição de inserção na lista atual (0 = antes do primeiro bloco). */
function moveBlockTo(id, index) {
  const from = indexOfId(id);
  if (from === -1) return;
  let to = index > from ? index - 1 : index;
  to = Math.max(0, Math.min(to, state.blocks.length - 1));
  if (to === from) return;
  record();
  const list = state.blocks.slice();
  const [item] = list.splice(from, 1);
  list.splice(to, 0, item);
  state.blocks = list;
  renderCanvas();
  selectBlock(id, { scroll: true });
  changed();
}

function moveBlockBy(id, delta) {
  const from = indexOfId(id);
  if (from === -1) return;
  moveBlockTo(id, delta < 0 ? from - 1 : from + 2);
}

function saveBlockToLibrary(id) {
  const block = blockById(id);
  if (!block) return;
  const { id: _omit, ...rest } = clone(block);
  const summary = blockSummary(block).slice(0, 40);
  savedBlocks = [{ id: uid(), name: summary ? `${blockLabel(block)}: ${summary}` : blockLabel(block), block: rest }, ...savedBlocks].slice(0, 30);
  if (!lsSet(SAVED_BLOCKS_STORAGE_KEY, savedBlocks)) {
    savedBlocks = savedBlocks.slice(1);
    toast("Não coube no armazenamento do navegador. Blocos com imagem embutida são pesados: use uma URL na imagem.", { error: true, ms: 6000 });
    return;
  }
  if (state.leftTab === "blocks") renderLeft();
  toast("Bloco salvo em “Meus blocos”", state.leftTab === "blocks" ? {} : { action: "Ver", onAction: () => setLeftTab("blocks") });
}

function blockAction(act, id) {
  if (act === "up") moveBlockBy(id, -1);
  if (act === "down") moveBlockBy(id, 1);
  if (act === "dup") duplicateBlock(id);
  if (act === "save") saveBlockToLibrary(id);
  if (act === "del") deleteBlock(id);
}

function applyTemplate(key, opts = {}) {
  const tpl = buildTemplateState(key);
  record();
  state.templateKey = tpl.templateKey;
  state.email = tpl.email;
  state.blocks = tpl.blocks;
  state.selectedId = null;
  dirtyId = null;
  renderAll();
  stageScroll.scrollTop = 0;
  changed();
  if (!opts.silent) toast(`Modelo “${templateByKey(key).name}” aplicado`, { action: "Desfazer", onAction: undo });
}

function createBlockEl(block) {
  const el = document.createElement("div");
  el.className = "blk";
  el.dataset.id = block.id;
  el.innerHTML = `
    <button class="blk-grip" type="button" data-grip tabindex="-1" aria-label="Arrastar bloco" title="Arraste para mover"><span>${icon("grip", 14)}</span></button>
    <div class="blk-barwrap"><div class="blk-bar" role="toolbar" aria-label="Ações do bloco">

      <span class="fmt">${FMT_BUTTONS.map(([cmd, html, title]) => `<button type="button" data-cmd="${cmd}" title="${title}" aria-label="${title}">${html}</button>`).join("")}<span class="sep"></span></span>
      <button type="button" data-act="up" title="Mover para cima (Alt+↑)" aria-label="Mover para cima">${icon("up", 15)}</button>
      <button type="button" data-act="down" title="Mover para baixo (Alt+↓)" aria-label="Mover para baixo">${icon("down", 15)}</button>
      <button type="button" data-act="dup" title="Duplicar (Ctrl+D)" aria-label="Duplicar">${icon("copy", 15)}</button>

    </div></div>
    <div class="blk-body"></div>`;
  updateBlockEl(el, block);
  return el;
}

function updateBlockEl(el, block) {
  el._block = block;
  el.dataset.type = block.type;
  el.toggleAttribute("data-hide", !!block.hideMobile);
  el.classList.remove("rich-focus");
  el.querySelector(".blk-name").textContent = blockLabel(block);
  const rows = renderBlock(block, { editor: true });
  el.querySelector(".blk-body").innerHTML = rows.trim()
    ? `<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; border-collapse:collapse;">${rows}</table>`
    : `<div class="ph-empty">${blockLabel(block)} vazio: preencha no painel ao lado. Sem conteúdo, este bloco não entra no e-mail.</div>`;
}

/* Atualiza só o que mudou: blocos são imutáveis, então comparar a referência basta. */
function renderCanvas() {
  canvas.className = `canvas ${state.view}${state.email.mobileOpt !== false ? " mopt" : ""}`;
  const existing = new Map();
  canvas.querySelectorAll(":scope > .blk").forEach(el => existing.set(el.dataset.id, el));
  const emptyEl = canvas.querySelector(":scope > .empty");
  if (emptyEl) emptyEl.remove();

  let prev = null;
  state.blocks.forEach(block => {
    let el = existing.get(block.id);
    if (el) {
      existing.delete(block.id);
      if (el._block !== block) updateBlockEl(el, block);
    } else {
      el = createBlockEl(block);
    }
    el.classList.toggle("selected", block.id === state.selectedId);
    const expected = prev ? prev.nextSibling : canvas.firstChild;
    if (expected !== el) canvas.insertBefore(el, expected);
    prev = el;
  });
  existing.forEach(el => el.remove());

  if (!state.blocks.length) {
    canvas.innerHTML = `<div class="empty"><b>Comece arrastando um bloco para cá</b>Ou clique em um bloco na lista à esquerda. Também dá para soltar uma imagem do computador aqui.</div>`;
  }
  if (state.leftTab === "layers") renderLeft();
}

function applyEmailLook() {
  canvas.style.background = normColor(state.email.containerBg, DEFAULT_CONTAINER_BG);
  stageScroll.style.background = normColor(state.email.emailBg, DEFAULT_EMAIL_BG);
  canvas.classList.toggle("mopt", state.email.mobileOpt !== false);
}

function flushDirty(exceptId) {
  if (!dirtyId || dirtyId === exceptId) return;
  const el = blockEl(dirtyId);
  const block = blockById(dirtyId);
  dirtyId = null;
  if (el && block) updateBlockEl(el, block);
}

function selectBlock(id, opts = {}) {
  flushDirty(id);
  const was = state.selectedId;
  state.selectedId = id || null;
  canvas.querySelectorAll(":scope > .blk").forEach(el => el.classList.toggle("selected", el.dataset.id === id));
  let tabChanged = false;
  if (id && opts.tab !== false && state.rightTab !== "block") { state.rightTab = "block"; tabChanged = true; }
  if (was !== state.selectedId || tabChanged) {
    renderRight();
    markLayers();
  }
  if (opts.scroll && id) {
    const el = blockEl(id);
    if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
}

          ? state.blocks.map(b => `<div class="layer${b.id === state.selectedId ? " on" : ""}" data-layer="${b.id}">${icon(BLOCK_TYPES[b.type].icon, 16)}<span class="txt"><b>${blockLabel(b)}</b><small>${esc(blockSummary(b).slice(0, 60)) || "&nbsp;"}</small></span>${b.hideMobile ? `<span title="Oculto no celular">${icon("eyeoff", 14)}</span>` : ""}</div>`).join("")
          : `<p class="hint">O e-mail ainda não tem blocos.</p>`}
      </div>
      <p class="hint">Arraste para reordenar. Clique para ir até o bloco.</p>`;
    return;
  }

  const current = state.templateKey;
  const tplRow = t => `
    <div class="tpl${t.key === current ? " on" : ""}" data-tpl="${t.key}" role="button" tabindex="0" title="Usar este modelo">
      <span class="swatch"></span>
      <span class="txt"><b>${esc(t.name)}</b><small>${esc(t.hint || (t.importedAt ? "Salvo em " + new Date(t.importedAt).toLocaleDateString("pt-BR") : "Modelo salvo"))}</small></span>
      ${t.source === "imported" ? `<button type="button" class="mini danger" data-del-tpl="${t.key}" title="Apagar modelo" aria-label="Apagar modelo">${icon("trash", 14)}</button>` : ""}
    </div>`;

  leftBody.innerHTML = `
    <div class="h">Modelos Bevinci</div>
    ${FIXED_TEMPLATES.map(tplRow).join("")}
    <div class="h">Meus modelos</div>
    ${importedTemplates.length ? importedTemplates.map(tplRow).join("") : `<p class="hint" style="margin-bottom:10px">Nenhum modelo salvo ainda.</p>`}
    ${isImportedTemplateKey(current) ? `<button type="button" class="btn block" data-do="update-tpl">${icon("save", 15)}Atualizar “${esc(templateByKey(current).name)}”</button>` : ""}
    <button type="button" class="btn block" data-do="save-tpl">${icon("plus", 15)}Salvar e-mail atual como modelo</button>
    <button type="button" class="btn block" data-do="import-tpl">${icon("upload", 15)}Importar HTML exportado</button>
    <p class="hint">Escolher um modelo substitui o e-mail em edição. Dá para desfazer com Ctrl+Z. Os modelos ficam guardados neste navegador.</p>`;
}

function markLayers() {
  if (state.leftTab !== "layers") return;
  leftBody.querySelectorAll(".layer").forEach(el => el.classList.toggle("on", el.dataset.layer === state.selectedId));
}

function setLeftTab(tab) {
  state.leftTab = tab;
  renderLeft();
}

async function saveCurrentAsTemplate() {
  const name = await askText({ title: "Salvar como modelo", label: "Nome do modelo", value: state.email.title || "Meu modelo" });
  if (!name) return;
  const tpl = {
    key: makeUniqueTemplateKey(name), name, source: "imported", importedAt: new Date().toISOString(),
    email: normalizeEmailOptions(state.email, name), blocks: stripIds(state.blocks)
  };
  importedTemplates = [...importedTemplates, tpl];
  if (!saveImportedTemplates()) {
    importedTemplates = importedTemplates.filter(t => t.key !== tpl.key);
    toast("O modelo não coube no armazenamento do navegador. Imagens embutidas pesam muito: troque por URLs ou exporte o HTML e guarde o arquivo.", { error: true, ms: 7000 });
    return;
  }
  state.templateKey = tpl.key;
  renderLeft();
  changed();
  toast(`Modelo “${name}” salvo`);
}

function updateCurrentTemplate() {
  const idx = importedTemplates.findIndex(t => t.key === state.templateKey);
  if (idx === -1) return;
  const before = importedTemplates;
  importedTemplates = importedTemplates.map((t, i) => i === idx
    ? { ...t, email: normalizeEmailOptions(state.email, t.name), blocks: stripIds(state.blocks), updatedAt: new Date().toISOString() }
    : t);
  if (!saveImportedTemplates()) {
    importedTemplates = before;
    toast("Não coube no armazenamento do navegador. Troque imagens embutidas por URLs.", { error: true, ms: 6000 });
    return;
  }
  toast(`Modelo “${importedTemplates[idx].name}” atualizado`);
}

function deleteTemplate(key) {
  const tpl = importedTemplates.find(t => t.key === key);
  if (!tpl) return;
  const before = importedTemplates;
  importedTemplates = importedTemplates.filter(t => t.key !== key);
  saveImportedTemplates();
  if (state.templateKey === key) state.templateKey = DEFAULT_TEMPLATE_KEY;
  renderLeft();
  toast(`Modelo “${tpl.name}” apagado`, {
    action: "Desfazer",
    onAction: () => { importedTemplates = before; saveImportedTemplates(); renderLeft(); }
  });
}

async function importTemplateHtml(html, fileName = "template.html") {
  const baseName = String(fileName || "template.html").replace(/\.(html?|txt)$/i, "");
  let parsed;
  try {
    parsed = parseImportedTemplateHtml(html, baseName);
  } catch (error) {
    toast(error.message || "Não consegui importar esse arquivo.", { error: true, ms: 6000 });
    return;
  }
  const defaultName = parsed.email.title || baseName || "Template importado";
  const name = (await askText({ title: "Importar HTML", label: "Nome do modelo", value: defaultName, ok: "Importar" })) || null;
  if (!name) return;

  const tpl = {
    key: makeUniqueTemplateKey(name), name, source: "imported", importedAt: new Date().toISOString(),
    email: normalizeEmailOptions(parsed.email, name), blocks: stripIds(parsed.blocks)
  };
  importedTemplates = [...importedTemplates, tpl];
  const stored = saveImportedTemplates();
  applyTemplate(tpl.key, { silent: true });
  setLeftTab("templates");
  if (!stored) {
    toast("O e-mail foi aberto, mas o modelo não coube no armazenamento do navegador e não ficará salvo na lista.", { error: true, ms: 7000 });
  } else {
    toast(parsed.importMode === "exact"
      ? "HTML importado com todos os blocos editáveis"
      : "HTML importado por leitura da estrutura. Revise os blocos convertidos.", { ms: 5000 });
  }
}

function palette() {
  const used = [];
  state.blocks.forEach(b => COLOR_FIELDS.forEach(f => {
    const c = b[f] && normColor(b[f], null);
    if (c && !BRAND_COLORS.includes(c) && !used.includes(c)) used.push(c);
  }));
  return [...BRAND_COLORS, ...used.slice(0, 6)];
}

  image: (label, path, value) => {

const LEVEL_ICON = { error: "error", warn: "alert", info: "note" };

function checksHtml() {
  const errors = derived.checks.filter(c => c.level === "error").length;
  const warns = derived.checks.filter(c => c.level === "warn").length;
  const pct = Math.min(100, Math.round((derived.size / GMAIL_CLIP_BYTES) * 100));
  const meterClass = derived.size > GMAIL_CLIP_BYTES ? "over" : pct > 80 ? "warn" : "";
  const summary = errors + warns === 0
    ? `<div class="check-sum ok">${icon("check", 18)}Nada pendente. Pode exportar.</div>`
    : `<div class="check-sum">${icon("alert", 18)}${[errors ? `${errors} ${errors === 1 ? "problema" : "problemas"}` : "", warns ? `${warns} ${warns === 1 ? "aviso" : "avisos"}` : ""].filter(Boolean).join(" e ")} antes de enviar</div>`;

  return `
    ${summary}
    <div class="weight">Peso do HTML: <b>${fmtKb(derived.size)}</b> de 102 kB (limite em que o Gmail corta a mensagem)
      <span class="meter ${meterClass}"><i style="width:${pct}%"></i></span>
    </div>
    ${derived.checks.map(c => {
      const target = c.blockId ? ` data-goto="${c.blockId}"` : c.tab ? ` data-gotab="${c.tab}"` : "";
      const tag = target ? "button" : "div";
      return `<${tag}${tag === "button" ? ' type="button"' : ""} class="issue ${c.level}"${target}>${icon(LEVEL_ICON[c.level], 16)}<span>${esc(c.text)}${c.detail ? `<small>${esc(c.detail)}</small>` : ""}</span></${tag}>`;
    }).join("")}
    <p class="hint">A checagem roda sozinha enquanto você edita. Clique em um item para ir até o bloco.</p>`;
}
